/* Layout: a square mahjong table — four seats round a felt centre showing the round wind; actions and the hand log below. */
:root{
  --lab:#1D5C46;
  --head:#5B2E12; --hl:#163A70; --tint-a:#E3F0E7; --tint-b:#F4EBDD; --tint-c:#E6ECF6;
  --pop:#C8562E; --pop-ink:#FFFFFF;
  --bg:#EDF2EE; --surface:#FFFFFF; --surface2:#F2F6F3; --fg:#1A1A17; --muted:#56685F; --line:#D5E0D9;
  --jade:#1E7A52; --jade-ink:#FFFFFF; --jade-soft:#DCEEE3;
  --red:#C0282D; --red-soft:#F8E1E1;
  --navy:#1D4D38; --navy-ink:#FFFFFF;
  --felt:#1F5A43; --felt-ink:#FFFFFF; --felt-muted:#B5D3C3;
  --shadow:0 1px 0 rgba(20,45,32,.06),0 6px 18px -10px rgba(20,45,32,.28);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --lab:#A8D5BA;
  --head:#F4A9B8; --hl:#9CC4FF; --tint-a:#173027; --tint-b:#2A2318; --tint-c:#1A2236;
  --bg:#0E1713; --surface:#16221C; --surface2:#1C2A23; --fg:#EFE6D2; --muted:#93A89C; --line:#29392F;
  --jade:#5FBF97; --jade-ink:#0B1A13; --jade-soft:#1F3A2F;
  --red:#F0766D; --red-soft:#3A1F1C;
  --navy:#7CCBA3; --navy-ink:#0B1A13; --pop:#F08A5D; --pop-ink:#1A0B05;
  --felt:#1B4A38; --felt-ink:#F2F5F0; --felt-muted:#9CC3AE;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --lab:#A8D5BA;
  --head:#F4A9B8; --hl:#9CC4FF; --tint-a:#173027; --tint-b:#2A2318; --tint-c:#1A2236;
  --bg:#0E1713; --surface:#16221C; --surface2:#1C2A23; --fg:#EFE6D2; --muted:#93A89C; --line:#29392F;
  --jade:#5FBF97; --jade-ink:#0B1A13; --jade-soft:#1F3A2F;
  --red:#F0766D; --red-soft:#3A1F1C;
  --navy:#7CCBA3; --navy-ink:#0B1A13; --pop:#F08A5D; --pop-ink:#1A0B05;
  --felt:#1B4A38; --felt-ink:#F2F5F0; --felt-muted:#9CC3AE;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* Skins chosen in settings (預設／米色／萬聖節); placed after the dark blocks so they win in both modes */
:root[data-skin="ice"]{
  --lab:#1E5A8C;
  --head:#0B3D6B; --hl:#1F6FB2; --tint-a:#E3F0FA; --tint-b:#F0F7FD; --tint-c:#E6EEF8;
  --pop:#2470B0; --pop-ink:#FFFFFF;
  --bg:#EEF5FB; --surface:#FFFFFF; --surface2:#F3F8FC; --fg:#0E2A47; --muted:#4E6A86; --line:#D3E2EF;
  --jade:#1B7A8C; --jade-ink:#FFFFFF; --jade-soft:#DCEFF3;
  --navy:#0E3A66; --navy-ink:#FFFFFF;
  --red:#C0392B; --red-soft:#F8E2E0;
  --felt:#1C4E80; --felt-ink:#FFFFFF; --felt-muted:#BFD9EE;
  --shadow:0 1px 0 rgba(14,42,71,.06),0 6px 18px -10px rgba(14,58,102,.32);
  color-scheme:light;
}
:root[data-skin="halloween"]{
  --lab:#FF9F43;
  --head:#FFB088; --hl:#C9A8FF; --tint-a:#2E1F3E; --tint-b:#33221A; --tint-c:#1F2533;
  --pop:#9B6BE0; --pop-ink:#FFFFFF;
  --bg:#140F1C; --surface:#221A2E; --surface2:#2B2139; --fg:#F3E9DC; --muted:#A897B5; --line:#3A2E4A;
  --jade:#FF8A1F; --jade-ink:#1A0F00; --jade-soft:#3D2614;
  --navy:#FF8A1F; --navy-ink:#1A0F00;
  --red:#FF4D6D; --red-soft:#3A1622;
  --felt:#2E1A47; --felt-ink:#FFE8CC; --felt-muted:#C6A8E0;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -10px rgba(255,138,31,.25);
  color-scheme:dark;
}
/* 薄霧: soft pink-lilac */
:root[data-skin="mist"]{
  --lab:#5B347F;
  --head:#9C2B5E; --hl:#5A3510; --tint-a:#F8E3EE; --tint-b:#EAE3F7; --tint-c:#F7EEDF;
  --pop:#D2921A; --pop-ink:#FFFFFF;
  --bg:#F3EDF7; --surface:#FFFFFF; --surface2:#F7F1FA; --fg:#2A1638; --muted:#7A6A8A; --line:#E4D8EE;
  --jade:#2F8A68; --jade-ink:#FFFFFF; --jade-soft:#EBE2F5;
  --red:#C2416E; --red-soft:#FBE3EC;
  --navy:#6A3D9A; --navy-ink:#FFFFFF;
  --felt:#5B347F; --felt-ink:#FFF8EC; --felt-muted:#D9C7EC;
  --shadow:0 1px 0 rgba(90,60,120,.05),0 8px 22px -12px rgba(140,100,190,.35);
  color-scheme:light;
}
:root[data-skin="mist"] .center{background-image:radial-gradient(circle at 30% 20%,rgba(255,206,120,.22),transparent 55%),radial-gradient(circle at 80% 90%,rgba(196,150,240,.35),transparent 60%)}
:root[data-skin="mist"] .settle-card{background-image:radial-gradient(circle at 20% 0%,rgba(255,206,120,.18),transparent 55%),radial-gradient(circle at 90% 100%,rgba(196,150,240,.3),transparent 60%)}
:root[data-skin="ice"] .center,:root[data-skin="ice"] .settle-card{background-image:radial-gradient(circle at 25% 15%,rgba(255,255,255,.28),transparent 45%),radial-gradient(circle at 85% 90%,rgba(140,200,245,.35),transparent 55%)}
:root[data-skin="ice"] header h1::after{content:" ❄";font-size:18px;color:#5FA8DC}
:root[data-skin="ice"] body,:root[data-skin="ice"] .lobby,:root[data-skin="ice"] .splash{background-image:radial-gradient(circle at 10% 0%,rgba(255,255,255,.9),transparent 40%),radial-gradient(circle at 100% 100%,rgba(190,220,245,.6),transparent 45%);background-attachment:fixed}
/* 便利店: white shop floor, green counter, orange + red signage */
:root[data-skin="maji"]{
  --lab:#5E6B22;
  --head:#7A3E1A; --hl:#2F5C8F; --tint-a:#E6EEF6; --tint-b:#EEF0DC; --tint-c:#F1E6F2;
  --pop:#B8564A; --pop-ink:#FFFFFF;
  --bg:#F7F1E5; --surface:#FFFCF5; --surface2:#F3EBDA; --fg:#3A2414; --muted:#7A6450; --line:#E6D9C2;
  --jade:#4F6B1E; --jade-ink:#FFFFFF; --jade-soft:#E9EDD5;
  --red:#B23A2E; --red-soft:#F8E2DC;
  --navy:#7A4A22; --navy-ink:#FFFFFF;
  --felt:#7A4A22; --felt-ink:#FFF8E7; --felt-muted:#F0DDBE;
  --shadow:0 1px 0 rgba(90,55,25,.08),0 6px 18px -10px rgba(90,55,25,.35);
  color-scheme:light;
}
/* 麻吉：四個位跟插圖四隻老鼠嘅顏色（下粉紅、右紫、上綠、左藍），中間係木枱 */
:root[data-skin="maji"] .seat[data-seat="0"]{background:#FBEDE8;border-color:#E7BAA5}
:root[data-skin="maji"] .seat[data-seat="1"]{background:#F3ECF6;border-color:#C6A9C7}
:root[data-skin="maji"] .seat[data-seat="2"]{background:#F0F1E0;border-color:#B9B57A}
:root[data-skin="maji"] .seat[data-seat="3"]{background:#E8F0F7;border-color:#94B2CA}
:root[data-skin="maji"] .seat.dealer{border-color:var(--red)}
:root[data-skin="maji"] .center,:root[data-skin="maji"] .settle-card{background-image:radial-gradient(circle at 50% 45%,rgba(216,162,64,.28),transparent 62%)}
:root[data-skin="store"]{
  --lab:#1D5C9E;
  --head:#B4410B; --hl:#00703A; --tint-a:#E1F2E7; --tint-b:#FFF0E0; --tint-c:#FDE6E6;
  --pop:#00843D; --pop-ink:#FFFFFF;
  --bg:#F2F4F1; --surface:#FFFFFF; --surface2:#F6F7F5; --fg:#0F2140; --muted:#5D6A62; --line:#DCE2DC;
  --jade:#00843D; --jade-ink:#FFFFFF; --jade-soft:#E1F2E7;
  --red:#DE2027; --red-soft:#FDE2E1;
  --navy:#D9590B; --navy-ink:#FFFFFF;
  --felt:#00843D; --felt-ink:#FFFFFF; --felt-muted:#C5E8D2;
  --shadow:0 1px 0 rgba(0,0,0,.05),0 6px 16px -10px rgba(0,0,0,.25);
  color-scheme:light;
}
:root[data-skin="store"] .center,:root[data-skin="store"] .settle-card{box-shadow:inset 0 -6px 0 #F58220,inset 0 -12px 0 #FFFFFF,inset 0 -18px 0 #DE2027}
:root[data-skin="store"] .settle-card{padding-bottom:28px}
:root[data-skin="store"] .center{padding-bottom:22px}
:root[data-skin="halloween"] header h1::after{content:" 🎃";font-size:20px}
:root[data-skin="halloween"] .center{background-image:radial-gradient(circle at 50% 40%,rgba(255,138,31,.18),transparent 70%)}
:root[data-skin="halloween"] .settle-card{background-image:radial-gradient(circle at 50% 0%,rgba(255,138,31,.16),transparent 60%)}
:root[data-skin="halloween"] .st-title::after{content:" 🦇";font-size:20px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0;letter-spacing:.04em;color:var(--navy)}
header h1{display:flex;align-items:center;gap:8px}
.hlogo{width:34px;height:34px;display:inline-flex;flex:none}
.hlogo img,.flogo img,.splash-logo img{width:100%;height:100%;display:block;object-fit:contain}
header h1 small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-left:6px}
.iconbtn{padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500}
.menubtn{position:relative;width:42px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--navy)}
.menubtn .mdot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
.menuscrim{position:fixed;inset:0;z-index:58}
.menupop{position:fixed;z-index:59;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px -10px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column}
.menupop button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:10px;font-size:15px;font-weight:700;text-align:left}
.menupop button:active,.menupop button:hover{background:var(--surface2)}
.menupop .mbadge{min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:20px;text-align:center}
.menupop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* table */
.table{display:grid;grid-template-columns:1fr 1.05fr 1fr;grid-template-rows:auto auto auto;gap:8px;grid-template-areas:". s2 ." "s3 c s1" ". s0 ."}
.seat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);min-width:0;position:relative;text-align:center;transition:transform .12s}
.seat:active{transform:scale(.97)}
.seat .wind{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.1;color:var(--fg)}
.seat .name{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .money{font-size:14px;font-weight:700}
.seat .tap{font-size:11px;color:var(--muted)}
.seat.dealer{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft),var(--shadow)}
.badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pos{color:var(--jade)} .neg{color:var(--red)} .zero{color:var(--muted)}
.center{grid-area:c;background:var(--felt);color:var(--felt-ink);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;text-align:center;min-height:118px;
  background-image:radial-gradient(circle at 50% 40%,rgba(255,255,255,.07),transparent 70%)}
.center .rw{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1}
.center .rwl{font-size:12px;letter-spacing:.2em;color:var(--felt-muted);margin-top:2px}
.center .hn{font-size:12px;color:var(--felt-muted);margin-top:6px}
.center .streak{margin-top:4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:999px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:12px 14px;border-radius:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.pop{background:var(--pop);color:var(--pop-ink);border-color:var(--pop)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rules{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.rules b{color:var(--fg);font-weight:500}

section h2{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 8px}
.log{display:flex;flex-direction:column;gap:6px}
.hand{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start}
.hand .tag{font-family:var(--f-display);font-weight:900;font-size:15px;background:var(--surface2);border-radius:8px;padding:2px 6px;grid-row:span 2;text-align:center;min-width:44px}
.hand .what{font-weight:700;min-width:0}
.hand .sub{font-size:12px;color:var(--muted);min-width:0}
.hand .deltas{grid-column:2;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px}
.empty{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.banner{background:var(--jade-soft);border-radius:12px;padding:10px 12px;font-size:13px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);max-width:600px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0 0 12px;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
input[type=text],input[type=number]{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
.opt.redon{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.prefix{position:relative}
.prefix span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.prefix input{padding-left:44px}
.hint{font-size:12px;color:var(--muted)}

.fanbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fantotal{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fantotal .big{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.faninput{width:96px!important;padding:6px 10px!important;font-size:28px!important;font-family:var(--f-display)!important;font-weight:900;text-align:left}
.err{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:13px;font-weight:700}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 .btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px}
.grid3 .btn small,.side .grid2 .btn small{font-size:11px;font-weight:500;color:var(--muted)}
.side .grid2 .btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px}
.side .dingrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.side .dingrow .opt{padding:6px 10px;font-size:13px}
.side .dingrow[hidden]{display:none!important}
.multi-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.multi-row .opt{flex:1}
.multi-row input{width:84px!important;flex:none;text-align:center}
#bannerBox:empty,#revengeBox:empty,#surrBox:empty{display:none}
.skinopt{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;white-space:normal}
.skinopt .ltd{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.02em}
.skinopt.on .ltd{color:inherit;opacity:.85}
.surr{background:var(--surface);border:1.5px solid var(--red);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.surr.done{border:1px dashed var(--line);color:var(--muted)}
.surr-btns{display:flex;flex-wrap:wrap;gap:6px}.surr-btns .btn{padding:8px 12px;color:var(--red);border-color:var(--red)}
.ended #surrBox,body.hk #surrBox{display:none!important}
.revenge{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:18px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:700;color:var(--jade)}
.chip.sel{background:var(--jade-soft);border-color:var(--jade)}
.chip .x{color:var(--muted);font-size:14px}
details.cat{border-top:1px solid var(--line)}
details.cat summary{padding:10px 2px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.cat summary::after{content:"＋";color:var(--muted)}
details.cat[open] summary::after{content:"－"}
details.cat .chips{padding-bottom:12px}

.photo{border:1px dashed var(--jade);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.photo .row{display:flex;gap:10px;align-items:center}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ai-out{font-size:13px;background:var(--surface2);border-radius:10px;padding:10px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}

.pay{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.pay .r{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.pay .r small{color:var(--muted);font-size:12px}
.sticky{position:sticky;bottom:0;background:var(--bg);padding-block:10px 4px;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.confirm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ro .edit-only{display:none!important}
body:not(.ro) .view-only{display:none!important}
.ro .seat{cursor:default}
.ro .seat:active{transform:none}
.live{font-size:12px;font-weight:700;color:var(--jade);background:var(--jade-soft);padding:4px 10px;border-radius:999px;letter-spacing:.06em}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.busy .seat,.busy .actions .btn{pointer-events:none;opacity:.6}
.endbtn{width:100%}
.ended #revengeBox,.ended .table,.ended .rules,.ended .actions,.ended .side,.ended .endbtn,.ended .view-only.hint{display:none!important}
.settle{display:flex;flex-direction:column;gap:10px}
.settle-card{background:var(--felt);color:var(--felt-ink);border-radius:18px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px;
  background-image:radial-gradient(circle at 50% 0%,rgba(255,255,255,.10),transparent 60%)}
.st-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.st-title{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.12em}
.st-meta{font-size:12px;color:var(--felt-muted)}
.pl{background:var(--surface);color:var(--fg);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.pl.first{box-shadow:0 0 0 2px #E2B53E}
.rk{font-family:var(--f-display);font-weight:900;font-size:22px;width:30px;text-align:center;color:var(--muted)}
.pl.first .rk{color:#B8860B}
.pname{display:flex;flex-direction:column;min-width:0}
.crown{font-size:22px;line-height:1;margin-bottom:2px}
.pname b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstats{font-size:12px;color:var(--muted)}
.pscore{text-align:right;display:flex;flex-direction:column}
.pscore b{font-size:17px}
.pscore small{font-size:12px;color:var(--muted)}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--fg)}
.tag.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.notag{font-size:12px;color:var(--muted)}
/* 特殊稱號：金光（根本不是一個Level／傳說）、銀色（稀有） */
.tag.gold,.tag.legend{position:relative;overflow:hidden;border:1px solid #B8860B;color:#5A3A00;
  background:linear-gradient(135deg,#F7E08A,#E2B53E 45%,#FFF1B8 60%,#C9962A);box-shadow:0 0 0 3px rgba(226,181,62,.28);padding:4px 14px}
.tag.legend.tw{color:#8E1B1B}.tag.legend.hk{color:#0F4D36}.tag.legend.vn{color:#6B1D52}.tag.rare.vn{color:#6B1D52}.sty-tags b.pill.legend.vn,.sty-tags b.pill.rare.vn{color:#6B1D52}
.tag.gold::after,.tag.legend::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.85) 48%,transparent 66%);transform:translateX(-120%);animation:shine 2.6s ease-in-out infinite}
.tag.gold .ti-crown{font-style:normal;margin-right:3px}
.tag .spk{position:absolute;top:1px;right:5px;font-style:normal;font-size:10px;color:#FFF7D6;text-shadow:0 0 4px #FFD54A;animation:twinkle 1.8s ease-in-out infinite;pointer-events:none}
.tag .spk.s2{top:auto;bottom:1px;right:auto;left:6px;animation-delay:.9s}
.tag.rare{background:linear-gradient(135deg,#F4F5F7,#C9CED6 50%,#FFFFFF 62%,#AEB4BE);border:1px solid #8D95A1;color:#1E2F5C}
.tag.rare.hk{color:#0F4D36}
:root[data-skin="mist"] .tag.rare{background:linear-gradient(135deg,#FBF4FA,#DCCDE6 50%,#FFFFFF 62%,#C3B2D3)}
.tag.gold.on,.tag.legend.on,.tag.rare.on{outline:2px solid var(--navy);outline-offset:2px}
.sp-line{margin-top:6px}
.sp-src{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pl.golden{box-shadow:0 0 0 2px #E2B53E;animation:edge 1.2s ease-out 1}
.pl .tag.gold,.pl .tag.legend{animation:pop .4s ease-out 1}
:root[data-skin="halloween"] .tag.gold,:root[data-skin="halloween"] .tag.legend{box-shadow:0 0 0 3px rgba(226,181,62,.45),0 0 14px rgba(255,200,80,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.gold,:root:not([data-theme="light"]) .tag.legend{box-shadow:0 0 0 3px rgba(226,181,62,.45),0 0 14px rgba(255,200,80,.3)}}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes edge{0%{box-shadow:0 0 0 2px #E2B53E,0 0 0 0 rgba(226,181,62,.7)}100%{box-shadow:0 0 0 2px #E2B53E,0 0 0 14px rgba(226,181,62,0)}}
.sty-tags b.pill{display:inline-block;border-radius:999px;padding:0 8px;margin-right:6px;
  background:linear-gradient(115deg,#F7E08A 0%,#E2B53E 40%,#FFF6CC 50%,#E2B53E 60%,#C9962A 100%);border:1px solid #B8860B;color:#5A3A00}
.sty-tags b.pill.legend.tw{color:#8E1B1B}.sty-tags b.pill.legend.hk{color:#0F4D36}
.sty-tags b.pill.rare{background:linear-gradient(115deg,#F4F5F7,#C9CED6 50%,#FFFFFF 62%,#AEB4BE);border-color:#8D95A1;color:#1E2F5C}
.sty-tags b.pill.rare.hk{color:#0F4D36}
.sty-rk.goldrk{color:#C9962A!important}
.tagdesc{grid-column:1/-1;font-size:13px;background:var(--jade-soft);border-radius:10px;padding:8px 10px}
.tagdesc b{display:block;font-size:12px;color:var(--jade)}
.share-lines{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.share-lines span b{color:var(--jade)}
.st-foot{font-size:11px;color:var(--felt-muted);text-align:center}
.settle-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.settle-actions .full{grid-column:1/-1}
#shareImg{display:block;width:auto;max-width:100%;max-height:56vh;margin:0 auto;border-radius:14px;border:1px solid var(--line)}
/* 9:16 story card for sharing (IG 限時動態 1080×1920) */
.story{width:360px;height:640px;box-sizing:border-box;padding:76px 20px 60px;background:var(--felt);color:var(--felt-ink);font-family:var(--f-body);
  display:flex;flex-direction:column;gap:16px;background-image:radial-gradient(circle at 50% 0%,rgba(255,255,255,.14),transparent 55%)}
.sty-head{display:flex;align-items:center;gap:12px}
.sty-logo{width:64px;height:64px;display:inline-flex;flex:none}
.sty-logo img{width:100%;height:100%;object-fit:contain;display:block}
.sty-logo.tint{background:var(--surface);border-radius:50%;padding:7px;box-sizing:border-box;box-shadow:0 0 0 2px var(--felt-muted)}
.sty-title{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1;letter-spacing:.12em}
.sty-meta{font-size:12px;color:var(--felt-muted);margin-top:6px}
.sty-list{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0}
.sty-row{background:var(--surface);color:var(--fg);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;align-items:center}
.sty-row.first{box-shadow:0 0 0 2px #E2B53E}
.sty-rk{font-family:var(--f-display);font-weight:900;font-size:20px;color:var(--muted);text-align:center}
.sty-row.first .sty-rk{color:#B8860B}
.sty-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sty-stats{font-size:11px;color:var(--muted)}
.sty-score{text-align:right;display:flex;flex-direction:column}
.sty-score b{font-size:17px}
.sty-score small{font-size:11px;color:var(--muted)}
.sty-tags{grid-column:2/-1;display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:1.35;border-top:1px solid var(--line);padding-top:5px;margin-top:3px}
.sty-tags b{color:var(--jade);margin-right:6px}
.sty-foot{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--felt-muted)}
.sty-foot span{width:22px;height:22px;display:inline-flex;background:var(--surface);border-radius:50%;padding:2px;box-sizing:border-box}
.sty-foot img{width:100%;height:100%;object-fit:contain}
.st-foot{display:flex;align-items:center;justify-content:center;gap:6px}
.flogo{width:22px;height:22px;display:inline-flex}
.hbtns{display:flex;gap:6px}
button.modechip{cursor:pointer;background:none}
button.modechip::after{content:" ⇄";font-size:11px}
.ro button.modechip{cursor:default;pointer-events:none}
.ro button.modechip::after{content:""}
.confirm[hidden],.splash[hidden]{display:none!important}
.confirm{position:fixed;inset:0;z-index:70;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.confirm-card{background:var(--bg);color:var(--fg);border-radius:18px;padding:18px 16px 14px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.confirm-card h3{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0 0 6px}
.confirm-card p{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.55}
.help-tabs{margin-bottom:12px}
.help-tabs .opt{padding:7px 11px;font-size:13px}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vn-card{grid-column:1/-1;margin:0 0 4px}.vn-card h3{margin:0 0 8px}
.vn-jk{display:grid;grid-template-columns:1fr;gap:4px}.vn-jk div{display:grid;grid-template-columns:80px 1fr;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.vn-jk b{font-family:var(--f-display);font-weight:900;color:var(--navy)}
.vn-rules{margin:0;padding-left:20px;font-size:14px;line-height:1.6}
.help-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.help-item span{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help-item b{font-size:12px;color:var(--jade);flex:none}
.help-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.help-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.help-head h3{margin:0}
.help-fan{font-weight:900;color:var(--navy-ink);background:var(--navy);border-radius:999px;padding:2px 10px;font-size:13px;flex:none}
.help-label{margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;padding-left:8px;border-left:3px solid var(--jade)}
.help-text{margin:0;font-size:15px;line-height:1.6}
.tiles{display:flex;flex-wrap:wrap;gap:10px 12px;padding:12px;background:var(--surface2);border-radius:12px}
.tgroup{display:flex;gap:2px}
.tile{width:28px;height:38px;border-radius:5px;background:#FFFDF6;border:1px solid #D9D2BF;box-shadow:0 3px 0 #8FBF97;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:900;font-size:13px;line-height:1.05;color:#1B1B1B}
.tile .su{font-size:12px}
.tile.m .su{color:#C0282D}.tile.p .su{color:#1F5FA8}.tile.s .su{color:#1F7A55}
.tile.h{font-size:18px}.tile.hC{color:#C0282D}.tile.hF{color:#1F7A55}.tile.hP::after{content:"";width:16px;height:22px;border:2px solid #1F5FA8;border-radius:3px}
.tile.fl{font-size:15px;color:#C9467A}
.lg-d{display:none!important}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-skin="ice"]):not([data-skin="mist"]):not([data-skin="store"]):not([data-skin="royal"]):not([data-skin="maji"]) .lg-l{display:none!important}
  :root:not([data-theme="light"]):not([data-skin="ice"]):not([data-skin="mist"]):not([data-skin="store"]):not([data-skin="royal"]):not([data-skin="maji"]) .lg-d{display:block!important}
}
:root[data-theme="dark"]:not([data-skin="ice"]):not([data-skin="mist"]):not([data-skin="store"]):not([data-skin="royal"]):not([data-skin="maji"]) .lg-l,:root[data-skin="halloween"] .lg-l{display:none!important}
:root[data-theme="dark"]:not([data-skin="ice"]):not([data-skin="mist"]):not([data-skin="store"]):not([data-skin="royal"]):not([data-skin="maji"]) .lg-d,:root[data-skin="halloween"] .lg-d{display:block!important}
.st-mode{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.06em;border:1.5px solid currentColor;border-radius:999px;padding:2px 10px;margin-left:10px;vertical-align:middle;opacity:.9}
.sty-title .st-mode{font-size:13px}
.st-brand{display:flex;align-items:center;gap:10px}
.slogo{width:54px;height:54px;display:inline-flex;flex:none}
.slogo img{width:100%;height:100%;display:block;object-fit:contain}
.st-foot{font-size:12px!important}
/* welcome screen */
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background-image:radial-gradient(circle at 50% 30%,var(--jade-soft),transparent 65%);transition:opacity .35s ease, transform .35s ease}
.splash.leaving{opacity:0;transform:scale(1.03)}
.splash-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;max-width:360px;width:100%}
.splash-logo{width:190px;height:190px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.splash-name{font-family:var(--f-display);font-weight:900;font-size:44px;margin:8px 0 0;color:var(--navy);letter-spacing:.06em;line-height:1.1}
.splash-name span{display:block;font-family:var(--f-body);font-size:16px;font-weight:700;letter-spacing:.3em;color:var(--muted);margin-top:4px}
.splash-pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;max-width:340px;margin-top:28px}
.splash-go{width:100%;padding:15px 8px;font-size:17px;border-radius:14px}
.splash{cursor:pointer}
.splash-tap{margin:36px 0 0;font-size:15px;font-weight:700;letter-spacing:.3em;color:var(--muted);animation:tapblink 2s ease-in-out infinite}
@keyframes tapblink{0%,100%{opacity:.35}50%{opacity:1}}
.splash-note{margin:4px 0 0;font-size:13px;color:var(--red);font-weight:700}
.modechip{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--navy);border:1.5px solid var(--navy);border-radius:999px;padding:1px 8px;letter-spacing:.04em}
.swaprow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.swaprow .w{font-weight:900;text-align:center}.swaprow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swaprow select{font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:170px}
.payup{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pu-head{display:flex;justify-content:space-between;align-items:baseline}.pu-head b{font-family:var(--f-display);font-size:18px}.pu-head span{font-size:12px;color:var(--muted)}
.pu-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;font-size:15px;padding:6px 2px;border-bottom:1px solid var(--line)}
.pu-row i{font-style:normal;color:var(--muted)}.pu-row b{color:var(--navy)}
/* 每個主題嘅色彩層次：標題 --head、重點數字 --hl、三種卡片底色 --tint-a/b/c */
header h1,.lobby-brand h1,.sheet h3,.card h3,.help-card h3,.confirm-card h3,.seat .wind{color:var(--head)!important}
.me-card:not(.lvmax){background:var(--tint-a)!important}.cal-card{background:var(--tint-b)!important}.stat-card{background:var(--tint-c)!important}
#ledgerBody .card:nth-of-type(3n+1){background:var(--tint-a)}#ledgerBody .card:nth-of-type(3n+2){background:var(--tint-b)}#ledgerBody .card:nth-of-type(3n){background:var(--tint-c)}
.ycard:nth-of-type(odd){background:var(--tint-a)}.ycard:nth-of-type(even){background:var(--tint-c)}
.statrow b,.me-lv b,.yc-time,.help-item b,.chip b{color:var(--hl)!important}
.btn.accent{background:var(--hl);border-color:var(--hl);color:var(--bg)}
.payup{background:var(--tint-c)}.pu-row b{color:var(--hl)}
/* 字體同文字角色：標題、標籤、內文、提示、數字分開大小同顏色 */
body{font-size:16px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.field>label,.lbl{font-size:13px!important;letter-spacing:.06em;color:var(--lab)!important;font-weight:700}
.hint{font-size:13px!important;line-height:1.55;color:var(--muted)}
.sheet h3{font-size:22px!important}
input[type=text],input[type=number],input[type=password],input[type=time],select{font-size:18px!important;color:var(--fg)}
.opt{font-size:15px}
.seat .name{font-size:16px}.seat .money{font-size:15px}
.hand .sub,.hand .deltas,.pstats,.sty-stats{font-size:13px}
.chip{font-size:14px}
.btn{font-size:16px}
body.hk #multiField,body.hk #revengeBox,.side .pmgang{display:none}

// 越南牌：6 番 = 1 滿；回傳 {single, double} 分
function vnPts(fan){
  const V = state.vn || {extra:6, bonus:0};
  const f = Math.max(0, Math.round(fan)), mun = Math.floor(f/6), r = f % 6;
  if(!mun) return {single:[1,1,2,4,8,16][r], double:[1,2,4,8,16,32][r], mun:0, r};
  const add = r * V.extra + mun * (V.bonus || 0);
  return {single:32*mun + add, double:64*mun + add, mun, r};
}
const vnTxt = f => { const v = vnPts(f); return v.mun ? `${v.mun} 滿${v.r?` ${v.r} 番`:""}` : `${f} 番`; };
// 廣東牌點數：半辣上 = 4 番後每番 ×1.5／×1.33 交替（16,24,32,48,64…）；全辣上 = 每番 ×2
function hkPoints(fan){
  const f = Math.max(0, Math.min(fan, state.hk.cap));
  if(state.hk.scale==="full" || f<=4) return Math.pow(2,f);
  const k = f-4; return 16 * Math.pow(2, Math.floor(k/2)) * (k%2 ? 1.5 : 1);
}

/* ---------- money logic ---------- */
const seatWind = (p, dealer=state.dealer) => WINDS[(p - dealer + 4) % 4];
const fmt = v => { const a = Math.abs(v); const s = Number.isInteger(a) ? a.toString() : a.toFixed(1); return (v>0?"+":v<0?"−":"") + "$" + s; };
const cls = v => v>0?"pos":v<0?"neg":"zero";

function computeWin(winner, discarder, fan){
  const deltas = [0,0,0,0], rows = [];
  if(isPM()){
    // 跑馬仔：每份 = 每底 × 2^番（封頂）；自摸三家各俾一份，出銃包一份；莊家有份就另加 (1 + 連莊數) 底
    const P = state.pm, f = Math.max(0, Math.min(fan, P.cap)), X = Math.pow(2, f) * P.unit;
    const payers = discarder===null ? [0,1,2,3].filter(p=>p!==winner) : [discarder];
    for(const p of payers){
      const dl = (P.dealer && (winner===state.dealer || p===state.dealer)) ? (1 + state.streak) * P.unit : 0;
      const amt = Math.round((X + dl)*100)/100;
      deltas[p] -= amt; deltas[winner] += amt;
      rows.push({p, bonus:dl, total:fan, amt, label:`${f}番 = ${Math.pow(2,f)}底${dl?` + 莊${1+state.streak}底`:""}`});
    }
    return {deltas, rows};
  }
  if(isVN()){
    // 自摸：三家俾雙；出銃：出銃俾雙，其餘兩家俾單（雞糊每家 1 分）
    const v = vnPts(fan), U = state.vn.unit;
    for(const p of [0,1,2,3].filter(p=>p!==winner)){
      const dbl = discarder===null || p===discarder, pts = dbl ? v.double : v.single;
      const amt = Math.round(pts * U * 100)/100;
      deltas[p] -= amt; deltas[winner] += amt;
      rows.push({p, bonus:0, total:fan, amt, label:`${vnTxt(fan)} = ${pts}分（${dbl?"雙":"單"}）`});
    }
    return {deltas, rows};
  }
  if(isHK()){
    const pts = hkPoints(fan), X = pts * state.hk.unit;
    const shares = discarder===null
      ? [0,1,2,3].filter(p=>p!==winner).map(p=>[p,0.5])
      : (state.hk.shoot==="half" ? [0,1,2,3].filter(p=>p!==winner).map(p=>[p, p===discarder?0.5:0.25]) : [[discarder,1]]);
    for(const [p,share] of shares){
      const amt = Math.round(X*share*100)/100;
      deltas[p] -= amt; deltas[winner] += amt;
      rows.push({p, bonus:0, total:fan, amt, label:`${Math.min(fan,state.hk.cap)}番 = ${pts}點${share<1?` × ${share===0.5?"½":"¼"}`:""}`});
    }
    return {deltas, rows};
  }
  // discarder === null → 自摸, all three pay
  const payers = discarder===null ? [0,1,2,3].filter(p=>p!==winner) : [discarder];
  for(const p of payers){
    const involvesDealer = (winner===state.dealer || p===state.dealer);
    const bonus = involvesDealer ? (state.dealerFan + state.streakFan*effStreak(winner===state.dealer ? p : winner)) : 0;
    const total = state.base + fan + bonus;
    const amt = Math.round(total * state.rate * 100)/100;
    deltas[p] -= amt; deltas[winner] += amt;
    rows.push({p, bonus, total, amt});
  }
  return {deltas, rows};
}
// 投降：閒家喺連莊 3／6／9… 時投降，之後佢同莊家之間嘅連莊番由 0 重新計（過莊後清除）
const surrOf = p => (state.surr && state.surr[p]) || 0;
const effStreak = p => Math.max(0, state.streak - surrOf(p));
const canSurrNow = p => !isCant() && !state.ended && p!==state.dealer && state.streak>=3 && state.streak%3===0 && surrOf(p) < state.streak;

  if(!canSurrNow(p)) return;
  const prev = snap();
  state.surr = (state.surr || [0,0,0,0]).slice(); state.surr[p] = state.streak;
  state.hands.push({kind:"side", type:"surr", player:p, desc:`莊家連${state.streak}時投降，之後對佢嘅連莊番由 0 計`, t:Date.now(), round:state.round, dealer:state.dealer, streak:state.streak, deltas:[0,0,0,0], prev});
  render(); save();
}

  list.forEach((w,i)=>{
    const items = (w.items||[]).slice(); let fan = w.fan;
    if(M){ items.push({name:M.name, fan:M.fan}); fan += M.fan; }
    const {deltas} = computeWin(w.winner, discarder, fan);
    let rev = null;
    if(R && R.from===w.winner){
      const amt = Math.round(R.fan*state.rate*100)/100;
      R.targets.forEach(t=>{ deltas[t] -= amt; deltas[w.winner] += amt; });
      rev = {targets:R.targets.slice(), fan:R.fan}; usedRevenge = true;
    }
    state.hands.push({kind:"win", t:Date.now(), round:state.round, dealer:state.dealer, streak:state.streak,
      winner:w.winner, discarder, fan, items, deltas, revenge:rev, group, groupFirst: i===0, multi: n>1 ? n : 0, prev: i===0 ? prev : null});
  });
  if(usedRevenge) state.revenge = null;
  if(M) state.revenge = {from:discarder, targets:list.map(w=>w.winner), fan:M.revenge};
  if(list.some(w=>w.winner===state.dealer)) state.streak++; else advanceDealer();
  render(); save();
}
function recordWin(winner, discarder, fan, items){ recordWins([{winner, fan, items}], discarder); }
function recordDraw(){
  const prev = snap();
  state.hands.push({kind:"draw", t:Date.now(), round:state.round, dealer:state.dealer, streak:state.streak, deltas:[0,0,0,0], prev});
  state.streak++;

}
const SIDE = {
  angang:{name:"暗槓", collect:true,  desc:"收三家各 1 底"},
  wai:   {name:"圍骰", collect:true,  desc:"收三家各 1 底"},
  hua:   {name:"一台花", collect:true, mult:1,   desc:"收三家各 1 底"},
  pmming:{name:"明槓", collect:true, pm:"ming", desc:"收三家"},
  pman:  {name:"暗槓", collect:true, pm:"an",   desc:"收三家"},
  cao:   {name:"一台草", collect:true, mult:0.5, desc:"收三家各半底"},
  shun:  {name:"順骰", collect:false, desc:"比三家各 1 底"},
  zhahu: {name:"詐糊", collect:false, fan:30, ding:true},
  zhading:{name:"詐叮", collect:false, fan:20, ding:true},
  surr:  {name:"投降", collect:false, desc:"之後對佢嘅連莊番由 0 計"},
};
const DING = [["無",0],["天叮",60],["地叮",40],["四子叮",20],["七子叮",15],["十子",10]];
let dingIdx = 0;
function sideFan(type){ const S = SIDE[type]; return S.fan ? S.fan + (S.ding ? DING[dingIdx][1] : 0) : state.base * (S.mult || 1); }
// 詐糊同莊家有關：台牌加莊番＋連拉番；跑馬仔（開咗莊家加注）加 (1+連莊) 底
function zhahuDealerExtra(p, q){
  if(p!==state.dealer && q!==state.dealer) return 0;
  if(isPM()) return state.pm.dealer ? (1 + state.streak) * state.pm.unit : 0;
  if(isHK() || isVN()) return 0;
  return (state.dealerFan + state.streakFan * effStreak(p===state.dealer ? q : p)) * state.rate;
}
function recordSide(type, p){
  const fanEach = sideFan(type);
  const cz = isCant() && type==="zhahu";
  const S = SIDE[type];
  const pmAmt = S.pm ? Math.round((state.pm[S.pm] || 0) * state.pm.unit * 100)/100 : null;
  const amt = cz ? cantZhahuEach() : pmAmt!==null ? pmAmt : Math.round(fanEach * state.rate * 100)/100;
  const sign = S.collect ? 1 : -1;
  const deltas = [0,0,0,0];
  let extra = 0;
  for(let q=0;q<4;q++){
    if(q===p) continue;
    const x = type==="zhahu" ? zhahuDealerExtra(p, q) : 0;
    const a = Math.round((amt + x)*100)/100;
    extra = Math.max(extra, x);
    deltas[q] -= sign*a; deltas[p] += sign*a;
  }
  const dTxt = extra ? (isPM() ? `；同莊家之間加 ${1+state.streak} 底` : `；同莊家之間加莊 ${state.dealerFan} 番${state.streak?`＋連${state.streak}拉${state.streak}`:""}`) : "";
  const desc = cz ? `賠三家各 $${amt}（按封頂自摸計）${dTxt}` : S.fan ? `比三家各 ${fanEach} 番${S.ding && DING[dingIdx][1] ? `（含${DING[dingIdx][0]} ${DING[dingIdx][1]} 番）` : ""}${dTxt}` : S.mult ? `收三家各 ${fanEach} 番（${S.mult===1?"1":"半"}底）` : S.pm ? `收三家各 ${state.pm[S.pm]} 底（$${amt}）` : S.desc;
  const prev = snap();
  const isHand = type==="zhahu";   // 詐糊當完一鋪：閒家詐糊莊家連莊；莊家詐糊過莊
  state.hands.push({kind:"side", type, player:p, desc, t:Date.now(), round:state.round, dealer:state.dealer, streak:state.streak, deltas, prev, hand:isHand||undefined});
  if(isHand){ if(p===state.dealer) advanceDealer(); else state.streak++; }
  if(S.ding) dingIdx = 0;
  render(); save();
}
function undo(){
  let h = state.hands.pop(); if(!h) return;
  while(h && h.group && !h.groupFirst) h = state.hands.pop();   // 雙響／三響 undo together
  if(!h) return;
  Object.assign(state, h.prev);
  if(!("revenge" in h.prev)) state.revenge = state.revenge || null;
  render(); save();
}

// 換位：兩個座位對調，所有記錄（食糊、出銃、雜項、莊家、投降、反雪）都跟人走
function swapSeats(a, b){
  if(a===b || !canWrite) return;
  const m = i => i===a ? b : i===b ? a : i;
  const sw = arr => { if(!Array.isArray(arr)) return arr; const o = arr.slice(); o[a] = arr[b]; o[b] = arr[a]; return o; };
  const fixRev = r => r ? Object.assign({}, r, {from:m(r.from), targets:(r.targets||[]).map(m)}) : r;
  const fixSnap = x => { if(!x) return x; const o = Object.assign({}, x); if("dealer" in o) o.dealer = m(o.dealer); if(o.surr) o.surr = sw(o.surr); if(o.revenge) o.revenge = fixRev(o.revenge); return o; };
  state.players = sw(state.players);
  if(state.uids) state.uids = sw(state.uids);
  state.dealer = m(state.dealer); state.startDealer = m(state.startDealer);
  if(state.surr) state.surr = sw(state.surr);
  if(state.revenge) state.revenge = fixRev(state.revenge);
  state.hands = state.hands.map(h=>{
    const o = Object.assign({}, h, {deltas:sw(h.deltas), dealer:m(h.dealer)});
    if("winner" in h) o.winner = m(h.winner);
    if(h.discarder!=null) o.discarder = m(h.discarder);
    if("player" in h) o.player = m(h.player);
    if(h.revenge) o.revenge = fixRev(h.revenge);
    if(h.prev) o.prev = fixSnap(h.prev);
    return o;
  });
  render(); save();
  if(typeof toast==="function") toast(`${state.players[b]} 同 ${state.players[a]} 已經換位。`);
}
window.__swapSeats = swapSeats;

const betterSp = (a,b) => !b || TIER_RANK[a.t.tier]>TIER_RANK[b.t.tier] || (TIER_RANK[a.t.tier]===TIER_RANK[b.t.tier] && a.fan>b.fan);

function computeStats(){
  const rate = unitRate();
  const S = [0,1,2,3].map(p=>({p, pts:0, money:0, wins:0, selfDraws:0, smallWins:0, discards:0, ddh:0, angang:0, kangWins:0,
    winFans:[], minRun:0, everNeg:false, started:false, maxConsec:0, cur:0, vs:[0,0,0,0]}));
  let handNo = 0;
  S.forEach(s=>s.special=null);
  for(const h of state.hands){
    if(isHandStart(h)) handNo++;
    // 逐對計數：每項入面，輸家按比例俾錢每位贏家（vs[j] > 0 = 贏咗 j 嘅錢）
    const posSum = h.deltas.reduce((a,d)=>a+(d>0?d:0),0);
    if(posSum>0) h.deltas.forEach((di,i)=>{ if(di<0) h.deltas.forEach((dj,j)=>{ if(dj>0){ const f = -di*dj/posSum; S[j].vs[i]+=f; S[i].vs[j]-=f; } }); });
    h.deltas.forEach((d,i)=>{ const s=S[i]; s.money += d; s.pts += d/rate; s.minRun = Math.min(s.minRun, s.pts); if(Math.abs(s.pts) > 1e-9) s.started = true; if(s.started && s.pts <= 1e-9) s.everNeg = true; });
    if(h.kind==="win"){
      const w = S[h.winner]; w.wins++; w.winFans.push(h.fan); if(isPM() || isVN() ? h.fan<=(isVN()?1:0) : isHK() ? h.fan<=(state.hk.min||3) : h.fan<10) w.smallWins++;
      if((h.items||[]).some(x=>x.name==="槓上自摸"||x.name==="槓上槓自摸")) w.kangWins++;
      const lead = !h.group || h.groupFirst;
      if(h.discarder===null) w.selfDraws++; else if(lead) S[h.discarder].discards++;
      if((h.items||[]).some(x=>x.name==="對對糊")) w.ddh++;
      for(const t of specialsFor(h)){
        const c = {t, fan:h.fan, no:handNo, label:(h.items||[]).map(x=>x.name).filter(n=>t.items.includes(n))[0] || `${h.fan}番`};
        if(betterSp(c, w.special)) w.special = c;
        if(t.tier==="legend" && h.discarder!==null){
          const wc = {t:WITNESS, fan:h.fan, no:handNo, label:`出銃俾${state.players[h.winner]}`};
          if(betterSp(wc, S[h.discarder].special)) S[h.discarder].special = wc;
        }
      }
      if(lead){
        const winners = new Set(h.group ? state.hands.filter(x=>x.group===h.group).map(x=>x.winner) : [h.winner]);
        S.forEach(s=>{ if(winners.has(s.p)){ s.cur++; s.maxConsec=Math.max(s.maxConsec,s.cur); } else s.cur=0; });
      }
    } else if(h.kind==="draw"){ S.forEach(s=>s.cur=0); }
    else if(h.kind==="side" && h.type==="angang"){ S[h.player].angang++; }
  }
  S.forEach(s=>{ s.vs = s.vs.map(r2); s.pts = r2(s.pts); s.money = r2(s.money); s.allPositive = !s.everNeg && s.pts>0; });
  const order = S.slice().sort((a,b)=> b.pts - a.pts || a.p - b.p);
  order.forEach((s,i)=> s.rank = i+1);
  const winsMax = Math.max(...S.map(s=>s.wins));
  S.forEach(s=>{ s.winsMax = winsMax; s.lead = s.rank===1 ? r2(order[0].pts - order[1].pts) : 0; });
  // Each player gets at most 2 titles; a title goes to only one player per game.
  // Titles are handed out in priority order; if several players qualify, the higher-ranked one gets it.
  S.forEach(s=>s.tags=[]);
  const given = new Set();
  for(const t of curTags()){
    if(given.has(t.name)) continue;
    const who = order.find(s=>s.tags.length<2 && t.test(s));
    if(who){ who.tags.push(t); given.add(t.name); }
  }
  return {S, order};
}

async function tintedMouse(color, bird){

  const [mi, bi] = await Promise.all([load(MOUSE_MASK), load(BIRD_MASK)]);
  const W = mi.naturalWidth, H = mi.naturalHeight;
  const layer = (img, col) => { const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d"); x.drawImage(img, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = col; x.fillRect(0, 0, W, H); return c; };

    }
  }

}

let wakeLock = null;
async function keepAwake(){
  try{
    const want = state.hands.length>0 && !state.ended && document.visibilityState==="visible";
    if(want && !wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; }); }
    else if(!want && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}

let h2cPromise = null, downloadsNs = null, shareFile = null, shareURL = null;
function loadH2C(){
  if(window.html2canvas) return Promise.resolve();
  if(!h2cPromise) h2cPromise = new Promise((ok,bad)=>{
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    sc.onload = ok; sc.onerror = ()=>{ h2cPromise=null; bad(); };
    document.head.appendChild(sc);
  });
  return h2cPromise;
}
$("shareBtn").onclick = async ()=>{
  showSheet($("shareSheet"));
  $("shareImg").hidden = true; $("saveImgBtn").hidden = true; $("nativeShareBtn").hidden = true; shareFile = null;
  $("shareHint").textContent = "製作圖片中…";
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;width:360px;height:640px";
  let logo = null;
  try{ const cs = getComputedStyle(document.documentElement); logo = await tintedMouse((cs.getPropertyValue("--head") || "#5B2E12").trim(), (cs.getPropertyValue("--red") || "#C0282D").trim()); }catch(e){}
  holder.innerHTML = storyHTML(logo);
  document.body.appendChild(holder);
  try{
    await loadH2C();
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all([...holder.querySelectorAll("img")].map(i=>i.decode ? i.decode().catch(()=>{}) : null));
    const canvas = await window.html2canvas(holder.firstElementChild, {scale:3, width:360, height:640, backgroundColor:null, logging:false, useCORS:true});
    const blob = await new Promise(r=>canvas.toBlob(r, "image/png"));
    const d = new Date();
    shareFile = new File([blob], `番鼠戰績-${d.getMonth()+1}-${d.getDate()}.png`, {type:"image/png"});
    if(shareURL) URL.revokeObjectURL(shareURL);
    shareURL = URL.createObjectURL(blob);
    $("shareImg").src = shareURL; $("shareImg").hidden = false;
    let canShare = false;
    try{ canShare = !!(navigator.canShare && navigator.canShare({files:[shareFile]})); }catch(e){}
    $("nativeShareBtn").hidden = !canShare;
    $("saveImgBtn").hidden = false;
    $("shareHint").textContent = canShare
      ? "圖片係 IG 限時動態比例（9:16）。撳下面掣揀 IG、WhatsApp 或 Telegram，或者長按圖片儲存。"
      : "圖片係 IG 限時動態比例（9:16）。長按圖片或者撳「儲存圖片」，再喺 IG、WhatsApp 或 Telegram 分享。";
  }catch(e){
    $("shareHint").textContent = "暫時整唔到圖片，可以直接用手機截圖分享。";
  }finally{ holder.remove(); }
};
$("nativeShareBtn").onclick = async ()=>{
  if(!shareFile) return;
  try{ await navigator.share({files:[shareFile], title:"番鼠戰績"}); }
  catch(e){
    if(e && e.name==="AbortError") return;
    $("nativeShareBtn").hidden = true;
    $("shareHint").textContent = "呢度唔可以直接分享。請長按圖片或者撳「儲存圖片」，再喺 IG、WhatsApp 或 Telegram 分享。";
  }
};
$("saveImgBtn").onclick = async ()=>{
  if(!shareFile) return;
  if(downloadsNs){
    try{ await downloadsNs.save({filename:shareFile.name, data:shareFile}); $("shareHint").textContent = "已儲存。"; }
    catch(e){ if(e && e.code!=="declined") $("shareHint").textContent = "儲存唔到，請長按圖片儲存。"; }

};

const NUMS = "一二三四五六七八九", SUITS = {m:"萬",p:"筒",s:"索"}, HON = {E:"東",S:"南",W:"西",N:"北",C:"中",F:"發",P:""}, FLW = "梅蘭菊竹春夏秋冬";
function tilesHTML(ex){
  return ex.split(/\s+/).filter(Boolean).map(g=>{
    let t = [];
    let mm;
    if(/^[ESWNCFP]+$/.test(g)) t = [...g].map(c=>`<span class="tile h h${c}">${HON[c]}</span>`);
    else if((mm = g.match(/^f(\d+)$/))) t = [...mm[1]].map(d=>`<span class="tile fl">${FLW[+d-1]}</span>`);
    else if((mm = g.match(/^(\d+)([mps])$/))) t = [...mm[1]].map(d=>`<span class="tile ${mm[2]}"><span>${NUMS[+d-1]}</span><span class="su">${SUITS[mm[2]]}</span></span>`);
    return `<span class="tgroup">${t.join("")}</span>`;
  }).join("");
}
let helpTab = 0, helpMode = null;

  $("helpList").innerHTML = (helpM()==="vn" && helpTab===0 ? `<div class="help-card vn-card"><h3>越南牌：8 隻百搭＋16 隻花</h3>

  $("helpList").querySelectorAll("button").forEach(b=>b.onclick=()=>showHelpDetail(cat[helpTab].items[+b.dataset.i]));

    $("discarderSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ ws.discarder=+b.dataset.i; renderWin(); });

/* 細 QR code 產生器：byte 模式、M 級糾錯、版本 1–10（最多 213 bytes），輸出 SVG */
const QR = (() => {
  // [每塊數據碼字, 塊數] 組合, 每塊糾錯碼字
  const BLK = [null, [[16,1],10],[[28,1],16],[[44,1],26],[[32,2],18],[[43,2],24],[[27,4],16],[[31,4],18],[[38,2,39,2],22],[[36,3,37,2],22],[[43,4,44,1],26]];
  const ALIGN = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const EXP = new Array(512), LOG = new Array(256);
  for(let i=0, x=1; i<255; i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if(x & 256) x ^= 0x11d; }
  for(let i=255; i<512; i++) EXP[i] = EXP[i-255];
  const gmul = (a,b) => a && b ? EXP[LOG[a] + LOG[b]] : 0;
  function rsGen(n){ let g = [1]; for(let i=0;i<n;i++){ const ng = new Array(g.length+1).fill(0); for(let j=0;j<g.length;j++){ ng[j] ^= g[j]; ng[j+1] ^= gmul(g[j], EXP[i]); } g = ng; } return g; }
  function rsEnc(data, n){ const g = rsGen(n), r = new Array(n).fill(0); for(const d of data){ const f = d ^ r[0]; r.shift(); r.push(0); for(let i=0;i<n;i++) r[i] ^= gmul(g[i+1], f); } return r; }
  const blocksOf = v => { const [b, ec] = [BLK[v][0], BLK[v][1]]; const out = []; for(let i=0;i<b.length;i+=2) for(let k=0;k<b[i+1];k++) out.push(b[i]); return {sizes:out, ec}; };
  const dataCap = v => blocksOf(v).sizes.reduce((a,b)=>a+b, 0);
  function bch(val, poly, bits){ let v = val << bits; const pl = Math.floor(Math.log2(poly)); while(Math.floor(Math.log2(v||1)) >= pl && v){ v ^= poly << (Math.floor(Math.log2(v)) - pl); } return (val << bits) | v; }
  function make(text){
    const bytes = [...new TextEncoder().encode(text)];
    let v = 1; while(v<=10 && 4 + (v<10?8:16) + bytes.length*8 > dataCap(v)*8) v++;
    if(v>10) throw new Error("QR 太長");
    // 數據位元
    const bits = []; const put = (x,n) => { for(let i=n-1;i>=0;i--) bits.push((x>>>i)&1); };
    put(4,4); put(bytes.length, v<10?8:16); bytes.forEach(b=>put(b,8));
    const cap = dataCap(v)*8;
    put(0, Math.min(4, cap - bits.length)); while(bits.length % 8) bits.push(0);
    const data = []; for(let i=0;i<bits.length;i+=8) data.push(parseInt(bits.slice(i,i+8).join(""),2));
    for(let p=0; data.length < dataCap(v); p++) data.push(p%2 ? 0x11 : 0xEC);
    // 分塊＋糾錯，交錯
    const {sizes, ec} = blocksOf(v); const db = [], eb = []; let o = 0;
    for(const s of sizes){ const d = data.slice(o, o+s); o += s; db.push(d); eb.push(rsEnc(d, ec)); }
    const cw = []; const mx = Math.max(...sizes);
    for(let i=0;i<mx;i++) for(const d of db) if(i<d.length) cw.push(d[i]);
    for(let i=0;i<ec;i++) for(const e of eb) cw.push(e[i]);
    // 矩陣
    const N = 17 + 4*v, M = [], F = [];
    for(let i=0;i<N;i++){ M.push(new Array(N).fill(0)); F.push(new Array(N).fill(false)); }
    const set = (r,c,val) => { M[r][c] = val ? 1 : 0; F[r][c] = true; };
    const finder = (r,c) => { for(let i=-1;i<=7;i++) for(let j=-1;j<=7;j++){ const rr=r+i, cc=c+j; if(rr<0||cc<0||rr>=N||cc>=N) continue;
      const on = i>=0&&i<=6&&j>=0&&j<=6 && (i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4)); set(rr,cc,on); } };
    finder(0,0); finder(0,N-7); finder(N-7,0);
    for(let i=8;i<N-8;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
    const A = ALIGN[v];
    const last = A.length - 1;
    A.forEach((r,ri)=>A.forEach((c,ci)=>{ if((ri===0&&ci===0)||(ri===0&&ci===last)||(ri===last&&ci===0)) return; for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++) set(r+i,c+j, Math.max(Math.abs(i),Math.abs(j))!==1); }));
    set(N-8, 8, 1); // dark module
    // 預留格式／版本資料
    for(let i=0;i<9;i++){ if(!F[8][i]) set(8,i,0); if(!F[i][8]) set(i,8,0); }
    for(let i=0;i<8;i++){ if(!F[8][N-1-i]) set(8,N-1-i,0); if(!F[N-1-i][8]) set(N-1-i,8,0); }
    if(v>=7) for(let i=0;i<6;i++) for(let j=0;j<3;j++){ set(i, N-11+j, 0); set(N-11+j, i, 0); }
    // 放數據（之字形）
    const cbits = []; cw.forEach(b=>{ for(let i=7;i>=0;i--) cbits.push((b>>i)&1); });
    let k = 0, up = true;
    for(let c=N-1; c>0; c-=2){ if(c===6) c--;
      for(let t=0;t<N;t++){ const r = up ? N-1-t : t;
        for(let d=0; d<2; d++){ const cc = c-d; if(!F[r][cc]){ M[r][cc] = k < cbits.length ? cbits[k] : 0; k++; } } }
      up = !up; }
    const MASKS = [(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,(r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,
      (r,c)=>(r*c)%2+(r*c)%3===0,(r,c)=>((r*c)%2+(r*c)%3)%2===0,(r,c)=>((r+c)%2+(r*c)%3)%2===0];
    const withMask = m => {
      const G = M.map((row,r)=>row.map((x,c)=>F[r][c] ? x : x ^ (MASKS[m](r,c)?1:0)));
      const fmt = bch((0<<3)|m, 0x537, 10) ^ 0x5412;   // M 級 = 00
      const fb = i => (fmt>>i)&1;
      for(let i=0;i<=5;i++) G[i][8] = fb(i);
      G[7][8] = fb(6); G[8][8] = fb(7); G[8][7] = fb(8);
      for(let i=9;i<15;i++) G[8][14-i] = fb(i);
      for(let i=0;i<8;i++) G[8][N-1-i] = fb(i);
      for(let i=8;i<15;i++) G[N-15+i][8] = fb(i);
      G[N-8][8] = 1;
      if(v>=7){ const vi = bch(v, 0x1f25, 12); for(let i=0;i<18;i++){ const b = (vi>>i)&1, r = Math.floor(i/3), c = N-11+i%3; G[r][c] = b; G[c][r] = b; } }
      return G;
    };
    const penalty = G => {
      let p = 0;
      for(let pass=0; pass<2; pass++) for(let i=0;i<N;i++){ let run = 1;
        for(let j=1;j<N;j++){ const a = pass ? G[j][i] : G[i][j], b = pass ? G[j-1][i] : G[i][j-1];
          if(a===b){ run++; if(run===5) p+=3; else if(run>5) p++; } else run = 1; } }
      for(let i=0;i<N-1;i++) for(let j=0;j<N-1;j++){ const x = G[i][j]; if(x===G[i+1][j] && x===G[i][j+1] && x===G[i+1][j+1]) p+=3; }
      const pat = [1,0,1,1,1,0,1,0,0,0,0], pat2 = pat.slice().reverse();
      for(let i=0;i<N;i++) for(let j=0;j<=N-11;j++){
        let h1=true,h2=true,v1=true,v2=true;
        for(let t=0;t<11;t++){ if(G[i][j+t]!==pat[t]) h1=false; if(G[i][j+t]!==pat2[t]) h2=false; if(G[j+t][i]!==pat[t]) v1=false; if(G[j+t][i]!==pat2[t]) v2=false; }
        p += 40*(h1+h2+v1+v2); }
      let dark = 0; G.forEach(r=>r.forEach(x=>dark+=x));
      p += 10*Math.floor(Math.abs(dark*100/(N*N) - 50)/5);
      return p;
    };
    let best = null, bp = Infinity;
    for(let m=0;m<8;m++){ const G = withMask(m), pp = penalty(G); if(pp < bp){ bp = pp; best = G; } }
    return best;
  }
  function svg(text, opts){
    const o = Object.assign({px:6, quiet:4, fg:"#14211B", bg:"#FFFFFF"}, opts || {});
    const G = make(text), N = G.length, S = (N + o.quiet*2);
    let d = ""; G.forEach((row,r)=>row.forEach((x,c)=>{ if(x) d += `M${c+o.quiet} ${r+o.quiet}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}" width="${S*o.px}" height="${S*o.px}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${S}" height="${S}" fill="${o.bg}"/><path d="${d}" fill="${o.fg}"/></svg>`;
  }
  return {make, svg};
})();

// QR 畫成 PNG（IG 圖用；SVG 喺 html2canvas 會走位）
function qrPng(text, fg, bg, quiet){
  const G = QR.make(text), N = G.length, q = quiet==null ? 2 : quiet, cell = 12, S = (N + q*2) * cell;
  const c = document.createElement("canvas"); c.width = c.height = S;
  const x = c.getContext("2d"); x.fillStyle = bg || "#FFFFFF"; x.fillRect(0,0,S,S); x.fillStyle = fg || "#000000";
  G.forEach((row,r)=>row.forEach((v,k)=>{ if(v) x.fillRect((k+q)*cell, (r+q)*cell, cell, cell); }));
  return c.toDataURL("image/png");
}

    async login(nick, pin){ const c = await auth.signInWithEmailAndPassword(nickEmail(nick), pinPass(pin)); return {uid:c.user.uid, name:c.user.displayName || nick}; },
    logout(){ return auth.signOut(); },
    async createRoom(code, data){ const ref = rooms.doc(code); if((await ref.get()).exists) return false; await ref.set(data); return true; },
    async getRoom(code){ const s = await rooms.doc(code).get(); return s.exists ? s.data() : null; },
    joinRoom(code, uid, name){ return rooms.doc(code).update({["members." + uid]: name}); },
    kick(code, uid){ return rooms.doc(code).update({["members." + uid]: firebase.firestore.FieldValue.delete(), ["kicked." + uid]: true}); },
    // 房主：心跳、轉讓；其他成員：房主離線夠耐就接手
    heartbeat(code){ return rooms.doc(code).update({hostSeen:Date.now()}); },
    setHost(code, uid, name){ return rooms.doc(code).update({host:uid, hostName:name, hostSeen:Date.now()}); },
    watchRoom(code, cb){ return rooms.doc(code).onSnapshot(s=>cb(s.exists ? s.data() : null), e=>{ console.error("watchRoom", e); if(auth.currentUser) auth.currentUser.getIdToken(true).catch(()=>{}); cb(undefined); }); },
    request(code, uid, r){ return rooms.doc(code).update({["req." + uid]: r}); },
    clearReq(code, uid){ return rooms.doc(code).update({["req." + uid]: firebase.firestore.FieldValue.delete()}); },
    pushState(code, json){ return rooms.doc(code).update({state:json, updatedAt:Date.now()}); },
    async saveRecords(list){ const b = db.batch(); list.forEach(r=>b.set(db.collection("users").doc(r.uid).collection("games").doc(r.gameId), r.data)); await b.commit(); },
    async myGames(uid){ const q = await db.collection("users").doc(uid).collection("games").orderBy("endedAt","desc").get(); return q.docs.map(d=>d.data()); },
    saveProfile(uid, data){ return db.collection("users").doc(uid).set(data, {merge:true}); },
    async isRemoved(uid){ try{ return (await db.collection("removed").doc(uid).get()).exists; }catch(e){ return false; } },
    async inbox(uid){ const q = await db.collection("users").doc(uid).collection("inbox").orderBy("at","desc").limit(100).get(); return q.docs.map(d=>Object.assign({id:d.id}, d.data())); },
    markRead(uid, id){ return db.collection("users").doc(uid).collection("inbox").doc(id).update({read:true}); },
    async claim(uid, id, items){
      const b = db.batch();
      b.update(db.collection("users").doc(uid).collection("inbox").doc(id), {claimed:true, read:true});
      b.update(db.collection("users").doc(uid), {frames: firebase.firestore.FieldValue.arrayUnion(...items), lastClaim:id});
      await b.commit();
    },
    setFrame(uid, frame){ return db.collection("users").doc(uid).update({frame}); },
    watchProfile(uid, cb){ return db.collection("users").doc(uid).onSnapshot(s=>cb(s.exists ? s.data() : {}), ()=>cb(null)); },
    async getProfiles(uids){ const out = {}; await Promise.all(uids.map(async u=>{ try{ const s = await db.collection("users").doc(u).get(); if(s.exists) out[u] = s.data(); }catch(e){} })); return out; },
    deleteGame(uid, gameId){ return db.collection("users").doc(uid).collection("games").doc(gameId).delete(); },
    // 約局
    async yueCreate(data){ const r = await db.collection("yue").add(data); return r.id; },
    yueWatch(id, cb){ return db.collection("yue").doc(id).onSnapshot(s=>cb(s.exists ? Object.assign({id:s.id}, s.data()) : null), ()=>cb(null)); },
    yueWatchMine(uid, cb){ return db.collection("yue").where("members", "array-contains", uid).onSnapshot(q=>cb(q.docs.map(d=>Object.assign({id:d.id}, d.data()))), ()=>cb(null)); },
    yueHost(id, data){ return db.collection("yue").doc(id).update(Object.assign({}, data, {updatedAt:Date.now()})); },
    yueSelf(id, uid, entry, join){ const F = firebase.firestore.FieldValue; return db.collection("yue").doc(id).update({["people." + uid]:entry, members: join ? F.arrayUnion(uid) : F.arrayRemove(uid), updatedAt:Date.now()}); },
    yueGuest(id, key, entry){ return db.collection("yue").doc(id).update({["people." + key]:entry, lastGuest:key, updatedAt:Date.now()}); },
    yueSetRoom(id, date, r){ return db.collection("yue").doc(id).update({["rooms." + date]:r, updatedAt:Date.now()}); },
    yueDelete(id){ return db.collection("yue").doc(id).delete(); },
    // 全站設定（公告、主題上架）：管理員寫，人人讀
    watchConfig(cb){ return db.collection("config").doc("site").onSnapshot(s=>cb(s.exists ? s.data() : {}), ()=>cb({})); },
  };

function mockBackend(){
  const L = k => { try{ return JSON.parse(localStorage.getItem("mock:"+k) || "null"); }catch(e){ return null; } };
  const W = (k,v) => { localStorage.setItem("mock:"+k, JSON.stringify(v)); window.dispatchEvent(new CustomEvent("mockchange", {detail:k})); };
  const me = () => { try{ return JSON.parse(sessionStorage.getItem("mock:me") || "null"); }catch(e){ return null; } };
  let userCb = null;
  const setMe = u => { if(u) sessionStorage.setItem("mock:me", JSON.stringify(u)); else sessionStorage.removeItem("mock:me"); if(userCb) userCb(u); };
  const fail = code => { const e = new Error(code); e.code = code; return e; };
  const watchKeys = (match, f) => {
    const a = e => { if(match(e.detail)) f(); }, b = e => { if(e.key && e.key.startsWith("mock:") && match(e.key.slice(5))) f(); };
    window.addEventListener("mockchange", a); window.addEventListener("storage", b); setTimeout(f, 0);
    return () => { window.removeEventListener("mockchange", a); window.removeEventListener("storage", b); };
  };
  return {
    onUser(cb){ userCb = cb; setTimeout(()=>{ const u = me(); cb(u ? Object.assign({email:nickEmail(u.name)}, u) : null); }, 0); },
    async register(nick, pin){ const U = L("users") || {}; const k = nickEmail(nick); if(U[k]) throw fail("auth/email-already-in-use");
      const u = {uid:"u"+Math.random().toString(36).slice(2,10), name:nick}; U[k] = Object.assign({pass:pinPass(pin)}, u); W("users", U); setMe(u); return u; },
    async login(nick, pin){ const r = (L("users") || {})[nickEmail(nick)]; if(!r || r.pass!==pinPass(pin)) throw fail("auth/invalid-credential"); const u = {uid:r.uid, name:r.name}; setMe(u); return u; },
    async logout(){ setMe(null); },
    async createRoom(code, data){ if(L("room:"+code)) return false; W("room:"+code, data); return true; },
    async getRoom(code){ return L("room:"+code); },
    async joinRoom(code, uid, name){ const r = L("room:"+code); r.members[uid] = name; W("room:"+code, r); },
    async heartbeat(code){ const r = L("room:"+code); if(!r || !me() || r.host!==me().uid) throw fail("permission-denied"); r.hostSeen = Date.now(); W("room:"+code, r); },
    async setHost(code, uid, name){ const r = L("room:"+code); if(!r || !me()) throw fail("permission-denied");
      const self = me().uid; const stale = (r.hostSeen || 0) < Date.now() - HOST_STALE;
      if(!(r.host===self || (uid===self && (self in (r.members||{})) && stale))) throw fail("permission-denied");
      r.host = uid; r.hostName = name; r.hostSeen = Date.now(); W("room:"+code, r); },
    async kick(code, uid){ const r = L("room:"+code); if(!me() || r.host!==me().uid) throw fail("permission-denied"); delete r.members[uid]; r.kicked = r.kicked || {}; r.kicked[uid] = true; W("room:"+code, r); },
    async request(code, uid, req){ const r = L("room:"+code); r.req = r.req || {}; r.req[uid] = req; W("room:"+code, r); },
    async clearReq(code, uid){ const r = L("room:"+code); if(r.req) delete r.req[uid]; W("room:"+code, r); },
    watchRoom(code, cb){
      const f = () => cb(L("room:"+code));
      const a = e => { if(e.detail==="room:"+code) f(); }, b = e => { if(e.key==="mock:room:"+code) f(); };
      window.addEventListener("mockchange", a); window.addEventListener("storage", b); setTimeout(f, 0);
      return () => { window.removeEventListener("mockchange", a); window.removeEventListener("storage", b); };
    },
    async pushState(code, json){ const r = L("room:"+code); if(!me() || r.host!==me().uid) throw fail("permission-denied"); r.state = json; r.updatedAt = Date.now(); W("room:"+code, r); },
    async saveRecords(list){
      for(const x of list){ const r = L("room:"+x.data.room); if(!r || r.host!==me().uid || !(x.uid in r.members)) throw fail("permission-denied"); }
      list.forEach(x=>{ const g = L("games:"+x.uid) || {}; g[x.gameId] = x.data; W("games:"+x.uid, g); });
    },
    async myGames(uid){ return Object.values(L("games:"+uid) || {}).sort((a,b)=>b.endedAt-a.endedAt); },
    async saveProfile(uid, data){ const P = L("profiles") || {}; P[uid] = Object.assign(P[uid] || {}, data); W("profiles", P); },
    async isRemoved(uid){ return !!(L("removed") || {})[uid]; },
    async inbox(uid){ return Object.entries(L("inbox:"+uid) || {}).map(([id,m])=>Object.assign({id}, m)).sort((a,b)=>b.at-a.at); },
    async markRead(uid, id){ const I = L("inbox:"+uid) || {}; if(I[id]){ I[id].read = true; W("inbox:"+uid, I); } },
    async claim(uid, id, items){ const I = L("inbox:"+uid) || {}; if(I[id]){ I[id].claimed = true; I[id].read = true; W("inbox:"+uid, I); }
      const P = L("profiles") || {}; const pr = P[uid] = P[uid] || {}; pr.frames = [...new Set((pr.frames || []).concat(items))]; W("profiles", P); },
    async setFrame(uid, frame){ const P = L("profiles") || {}; (P[uid] = P[uid] || {}).frame = frame; W("profiles", P); },
    watchProfile(uid, cb){ return watchKeys(k=>k==="profiles", ()=>cb(Object.assign({}, (L("profiles") || {})[uid] || {}))); },
    async getProfiles(uids){ const P = L("profiles") || {}; const o = {}; uids.forEach(u=>{ if(P[u]) o[u] = P[u]; }); return o; },
    async deleteGame(uid, gameId){ const g = L("games:"+uid) || {}; delete g[gameId]; W("games:"+uid, g); },
    // 約局（假後台）
    async yueCreate(data){ const C = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; const id = Array.from({length:20}, ()=>C[Math.floor(Math.random()*62)]).join(""); W("yue:"+id, data); return id; },
    yueWatch(id, cb){ return watchKeys(k=>k==="yue:"+id, ()=>{ const d = L("yue:"+id); cb(d ? Object.assign({id}, d) : null); }); },
    yueWatchMine(uid, cb){ return watchKeys(k=>k.startsWith("yue:"), ()=>{ const out = []; for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith("mock:yue:")){ const d = L(k.slice(5)); if(d && (d.members||[]).includes(uid)) out.push(Object.assign({id:k.slice(9)}, d)); } } cb(out); }); },
    async yueHost(id, data){ const d = L("yue:"+id); if(!d) throw fail("not-found"); if(!me() || d.host!==me().uid) throw fail("permission-denied"); W("yue:"+id, Object.assign(d, data, {updatedAt:Date.now()})); },
    async yueSelf(id, uid, entry, join){ const d = L("yue:"+id); if(!d) throw fail("not-found"); if(!me() || me().uid!==uid) throw fail("permission-denied"); d.people = d.people || {}; d.people[uid] = entry; d.members = (d.members||[]).filter(x=>x!==uid).concat(join ? [uid] : []); d.updatedAt = Date.now(); W("yue:"+id, d); },
    async yueGuest(id, key, entry){ const d = L("yue:"+id); if(!d) throw fail("not-found"); if(!/^g_/.test(key) || (d.people||{})[key]) throw fail("permission-denied"); d.people = d.people || {}; d.people[key] = entry; d.updatedAt = Date.now(); W("yue:"+id, d); },
    async yueSetRoom(id, date, r){ const d = L("yue:"+id); if(!d || !me() || d.host!==me().uid) throw fail("permission-denied"); d.rooms = d.rooms || {}; d.rooms[date] = r; W("yue:"+id, d); },
    watchConfig(cb){ return watchKeys(k=>k==="config", ()=>cb(L("config") || {})); },
    async yueDelete(id){ const d = L("yue:"+id); if(!d || !me() || d.host!==me().uid) throw fail("permission-denied"); localStorage.removeItem("mock:yue:"+id); window.dispatchEvent(new CustomEvent("mockchange", {detail:"yue:"+id})); },
  };
}

function monthStart(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1).getTime(); }
function ledgerStats(scope){
  const all = ONLINE.games || [];
  const G = (scope==="month" ? all.filter(g=>g.endedAt>=monthStart()) : all).filter(g=>!g.vs || g.vs.some(v=>Math.abs(v.money||0)>=0.005) || Math.abs(g.money||0)>=0.005);   // 打和嘅記錄唔計
  const out = {n:G.length, net:0, firsts:0, opp:new Map(), specials:new Map(), tags:new Map(), games:G};
  for(const g of G){
    out.net += g.money || 0; if(g.rank===1) out.firsts++;
    for(const v of g.vs || []){
      const k = v.uid || ("guest:" + v.name);
      const o = out.opp.get(k) || {name:v.name, guest:!v.uid, money:0, n:0};
      o.money += v.money || 0; o.n++; o.name = v.name; out.opp.set(k, o);
    }
    const sp = [];
    if(g.gold) sp.push({name:"根本不是一個Level", tier:"gold"});
    if(g.special) sp.push(g.special);
    for(const x of sp){ const o = out.specials.get(x.name) || {tier:x.tier, n:0}; o.n++; out.specials.set(x.name, o); }
    for(const t of g.tags || []) if(t!=="根本不是一個Level") out.tags.set(t, (out.tags.get(t)||0) + 1);
  }
  // 同一個人：按帳戶 ID 累計；以訪客身份打過但同帳戶同名嘅，都併入佢個帳戶
  const byName = new Map();
  for(const [k,o] of out.opp) if(!o.guest) byName.set(o.name, k);
  for(const [k,o] of [...out.opp]) if(Math.abs(o.money)<0.005) out.opp.delete(k);   // 同佢打和就唔列
  for(const [k,o] of [...out.opp]) if(o.guest && byName.has(o.name)){
    const t = out.opp.get(byName.get(o.name)); t.money += o.money; t.n += o.n; out.opp.delete(k);
  }
  out.net = Math.round(out.net*100)/100;
  return out;
}

function subscribeRoom(code){

      ONLINE.unsub = null;
      clearTimeout(ONLINE.retry); ONLINE.retry = setTimeout(()=>{ if(ONLINE.room===code) subscribeRoom(code); }, 2000);

function onRoomSnap(d){
  const wasHost = ONLINE.isHost, hadDoc = !!ONLINE.roomDoc;
  ONLINE.roomDoc = d; ONLINE.live = true; ONLINE.syncedAt = Date.now();
  ONLINE.isHost = d.host===ONLINE.user.uid;
  if(hadDoc && wasHost && !ONLINE.isHost) toast(`${d.hostName || "其他人"} 而家做房主。`);
  if(hadDoc && !wasHost && ONLINE.isHost) toast("你而家係房主，可以記錄同改設定。");
  hostBeat();
  if(!ONLINE.isHost && d.kicked && d.kicked[ONLINE.user.uid]){
    toast("房主已經將你移出房間。");
    try{ localStorage.removeItem("fansyu-lastroom"); }catch(e){}
    leaveRoom(); return;
  }
  canWrite = ONLINE.isHost; applyMode();
  if((!ONLINE.isHost || ONLINE.firstSnap) && d.state && d.state!==ONLINE.lastSent){
    const before = ONLINE.firstSnap ? null : {n:state.hands.length, gid:state.gameId, players:state.players.slice()};
    try{ state = Object.assign(DEFAULT_STATE(), JSON.parse(d.state)); }catch(e){}
    if(before && !ONLINE.isHost) liveHandToast(before);
  }
  ONLINE.firstSnap = false;
  // 房主結算咗：其他玩家即時讀返自己嘅小氣簿同經驗值
  const endKey = state.ended ? (state.gameId || "") + ":" + (state.endedAt || "") : "";
  if(!ONLINE.isHost && endKey && ONLINE.lastEndKey!==undefined && endKey!==ONLINE.lastEndKey && (state.uids || []).includes(ONLINE.user.uid)){
    const gid = ONLINE.room + "_" + state.gameId;

      if(g) toast(`已記入你嘅小氣簿：${money(g.money)}${g.xp ? `，+${g.xp} 經驗` : ""}。`); }, 1800);
  }
  ONLINE.lastEndKey = endKey;
  // 結算時重新攞一次各人資料（收款資料可能啱啱先填）
  if(endKey && ONLINE.payKey!==endKey){ ONLINE.payKey = endKey; (state.uids || []).forEach(u=>{ if(u && u!==ONLINE.user.uid) delete ONLINE.profiles[u]; }); }
  if(state.profV && state.profV!==ONLINE.profV){ ONLINE.profV = state.profV; const me = ONLINE.user && ONLINE.profiles[ONLINE.user.uid]; ONLINE.profiles = {}; if(me) ONLINE.profiles[ONLINE.user.uid] = me; }
  if(ONLINE.isHost) hostProcess(d);

// 房主每記一鋪，其他人即時見到一句提示
function liveHandToast(before){
  if(state.gameId!==before.gid){ return; }
  const P = state.players, n = state.hands.length;
  if(n < before.n){ toast("房主撤銷咗上一項記錄。"); return; }
  if(n === before.n) return;
  const h = state.hands[n-1];
  let t = "";
  if(h.kind==="win"){
    const wins = state.hands.slice(before.n).filter(x=>x.kind==="win");
    t = wins.map(w=>`${P[w.winner]} ${w.discarder==null ? "自摸" : "食 " + P[w.discarder]} ${w.fan} ${PT_UNIT()}，${fmt(w.deltas[w.winner])}`).join("；");
  } else if(h.kind==="draw") t = "流局，莊家連莊。";
  else if(h.kind==="side") t = `${P[h.player] || ""}：${h.desc || ""}`;
  if(t) toast("🀄 " + t);
}
// 房主：同步成員改名；處理閒家喺自己手機送嚟嘅投降
function hostProcess(d){
  let changed = false;
  const uids = state.uids || [];
  uids.forEach((u,i)=>{ if(u && d.members && d.members[u] && state.players[i]!==d.members[u]){ state.players[i] = d.members[u]; changed = true; } });
  // 新入房嘅朋友：自動坐入第一個空位（未改名嘅「玩家n」位）
  if(!state.ended) for(const [u,n] of Object.entries(d.members || {})){
    if((state.uids || []).includes(u)) continue;
    const i = [0,1,2,3].find(k=>!(state.uids || [])[k]);    // 按次序換走虛擬玩家；坐滿真人就唔換
    if(i===undefined) break;
    state.uids = (state.uids || [null,null,null,null]).slice(); state.uids[i] = u; state.players[i] = n; changed = true;
    toast(`${n} 已經坐入${seatWind(i)}位。`);
  }
  for(const [u,r] of Object.entries(d.req || {})){
    if(!r || ONLINE.handledReq[u]===r.t) continue;
    ONLINE.handledReq[u] = r.t;
    if(r.type==="prof"){ state.profV = Date.now(); changed = true; }
    else if(r.type==="surr" && uids[r.p]===u && state.dealer===r.dealer && state.streak===r.streak && canSurrNow(r.p)){
      recordSurrender(r.p); changed = false;
      toast(`${state.players[r.p]} 投降咗。`);
    }
    ONLINE.backend.clearReq(ONLINE.room, u).catch(()=>{});
  }
  if(changed){ render(); save(); }
}

  ONLINE.room = null; ONLINE.roomDoc = null; ONLINE.isHost = false;

const ADMIN_EMAIL = "ue7aea1e79086e593a1@fansyu.app";   // 暱稱「管理員」
const isAdminUser = () => !!(ONLINE.user && ((ONLINE.user.email || "").toLowerCase()===ADMIN_EMAIL || nickEmail(ONLINE.user.name||"")===ADMIN_EMAIL));

const FRAMES = [["fire","火焰"],["ice","冰"],["forest","森林"],["rose","玫瑰"],["sparrow","麻雀"],["gold","金光閃閃"],["choco","朱古力"],["halloween","萬聖節"],["xmas","聖誕節"],["crystal","魔法水晶球"]];
const FRAME_NAME = Object.fromEntries(FRAMES);
const frameOf = prof => (prof && prof.frame && (prof.frames || []).includes(prof.frame) && FRAME_NAME[prof.frame]) ? prof.frame : "";
const frameUid = uid => uid ? frameOf(ONLINE.profiles[uid]) : "";
const framed = (html, fr) => fr ? `<span class="nf fr-${fr}"><span class="nf-in">${html}</span></span>` : html;
function ensureProfiles(uids){
  const missing = [...new Set(uids.filter(u=>u && !(u in ONLINE.profiles) && !ONLINE.profFetching.has(u)))];
  if(!missing.length) return;
  missing.forEach(u=>ONLINE.profFetching.add(u));
  ONLINE.backend.getProfiles(missing).then(P=>{
    missing.forEach(u=>{ ONLINE.profiles[u] = P[u] || null; ONLINE.profFetching.delete(u); });
    render();
    if(openSheet && openSheet.id==="roomSheet") renderRoomSheet();
  }).catch(()=>{ missing.forEach(u=>ONLINE.profFetching.delete(u)); });
}
const ROYAL = ["royal","尊爵不凡"];
// 自己嘅帳戶資料（VIP、外框）：即時監聽；讀唔到就保留上次（部機記住）嘅資料再重試，唔會當咗冇 VIP
function startMeWatch(uid){
  stopMeWatch();
  let cached = null; try{ cached = JSON.parse(localStorage.getItem("fansyu-me-" + uid) || "null"); }catch(e){}
  if(cached && (!ONLINE.me || ONLINE.meUid!==uid)){ ONLINE.me = cached; ONLINE.meUid = uid; ONLINE.profiles[uid] = cached; applyVipPerks(); renderLobby(); }
  ONLINE.meUid = uid;
  const go = () => {
    if(!ONLINE.user || ONLINE.user.uid!==uid) return;
    ONLINE.meUnsub = ONLINE.backend.watchProfile(uid, d=>{
      if(!ONLINE.user || ONLINE.user.uid!==uid) return;
      if(d===null){ stopMeWatch(); clearTimeout(ONLINE.meRetry); ONLINE.meRetry = setTimeout(go, 3000); return; }
      ONLINE.me = d; ONLINE.profiles[uid] = d;
      try{ localStorage.setItem("fansyu-me-" + uid, JSON.stringify(d)); }catch(e){}
      applyVipPerks(); if(!$("lobby").hidden) renderLobby(); render();
    });
  };
  go();
}
function stopMeWatch(){ clearTimeout(ONLINE.meRetry); if(ONLINE.meUnsub){ try{ ONLINE.meUnsub(); }catch(e){} } ONLINE.meUnsub = null; }
function applyVipPerks(){
  const vip = !!(ONLINE.me && ONLINE.me.vip);
  const i = SKINS.findIndex(x=>x[0]==="royal");
  if(vip && i<0) SKINS.push(ROYAL);
  if(!vip && i>=0) SKINS.splice(i,1);
  let k = null; try{ k = localStorage.getItem("fansyu-skin"); }catch(e){}
  if(!vip && (k==="royal" || state.skin==="royal")){ try{ localStorage.setItem("fansyu-skin","maji"); }catch(e){} if(state.skin==="royal") state.skin = "maji"; }
  applySkin();
}
