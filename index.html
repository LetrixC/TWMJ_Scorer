/* Layout: a square mahjong table — four seats round a felt centre showing the round wind; actions and the hand log below. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F3F5F8; --fg:#17223B; --muted:#5B6578; --line:#D8DEE7;
  --jade:#1F7A55; --jade-ink:#FFFFFF; --jade-soft:#DFEFE7;
  --red:#C0282D; --red-soft:#F8E1E1;
  --navy:#1E2F5C; --navy-ink:#FFFFFF;
  --felt:#1F5C45; --felt-ink:#FFFFFF; --felt-muted:#B9D4C6;
  --shadow:0 1px 0 rgba(20,40,30,.06),0 6px 18px -10px rgba(20,40,30,.25);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1520; --surface:#18202D; --surface2:#1F2836; --fg:#E6EBF2; --muted:#94A0B2; --line:#2B3546;
  --jade:#5FBF97; --jade-ink:#0B1A13; --jade-soft:#1F3A2F;
  --red:#F0766D; --red-soft:#3A1F1C;
  --navy:#8DA6F2; --navy-ink:#0B1220;
  --felt:#1B4A38; --felt-ink:#F2F5F0; --felt-muted:#9CC3AE;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1520; --surface:#18202D; --surface2:#1F2836; --fg:#E6EBF2; --muted:#94A0B2; --line:#2B3546;
  --jade:#5FBF97; --jade-ink:#0B1A13; --jade-soft:#1F3A2F;
  --red:#F0766D; --red-soft:#3A1F1C;
  --navy:#8DA6F2; --navy-ink:#0B1220;
  --felt:#1B4A38; --felt-ink:#F2F5F0; --felt-muted:#9CC3AE;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* Skins chosen in settings (預設／米色／萬聖節); placed after the dark blocks so they win in both modes */
:root[data-skin="beige"]{
  --bg:#F3EBDD; --surface:#FFFBF3; --surface2:#F7EFE2; --fg:#3A2E22; --muted:#7A6A58; --line:#E3D6C2;
  --jade:#4F7A3A; --jade-ink:#FFFFFF; --jade-soft:#F1E2CC;
  --navy:#8A5A2B; --navy-ink:#FFFFFF;
  --red:#B4412F; --red-soft:#F6DED7;
  --felt:#6B4A2E; --felt-ink:#FBF3E6; --felt-muted:#D9C3A5;
  --shadow:0 1px 0 rgba(60,40,20,.06),0 6px 18px -10px rgba(60,40,20,.28);
  color-scheme:light;
}
:root[data-skin="halloween"]{
  --bg:#140F1C; --surface:#221A2E; --surface2:#2B2139; --fg:#F3E9DC; --muted:#A897B5; --line:#3A2E4A;
  --jade:#FF8A1F; --jade-ink:#1A0F00; --jade-soft:#3D2614;
  --navy:#FF8A1F; --navy-ink:#1A0F00;
  --red:#FF4D6D; --red-soft:#3A1622;
  --felt:#2E1A47; --felt-ink:#FFE8CC; --felt-muted:#C6A8E0;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -10px rgba(255,138,31,.25);
  color-scheme:dark;
}
/* 薄霧: soft pink-lilac */
:root[data-skin="mist"]{
  --bg:#F4EEF6; --surface:#FFFFFF; --surface2:#F8F2FA; --fg:#3B2F45; --muted:#7F7193; --line:#E7DDEE;
  --jade:#5E54B0; --jade-ink:#FFFFFF; --jade-soft:#EEE8F8;
  --red:#C9467A; --red-soft:#FBE4EE;
  --navy:#7B5DB0; --navy-ink:#FFFFFF;
  --felt:#8E78BE; --felt-ink:#FFFFFF; --felt-muted:#EDE2FA;
  --shadow:0 1px 0 rgba(90,60,120,.05),0 8px 22px -12px rgba(140,100,190,.35);
  color-scheme:light;
}
:root[data-skin="mist"] .center{background-image:radial-gradient(circle at 30% 20%,rgba(255,214,236,.45),transparent 60%),radial-gradient(circle at 80% 90%,rgba(255,255,255,.25),transparent 55%)}
:root[data-skin="mist"] .settle-card{background-image:radial-gradient(circle at 20% 0%,rgba(255,214,236,.4),transparent 60%)}
/* 便利店: white shop floor, green counter, orange + red signage */
:root[data-skin="store"]{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface2:#F6F7F5; --fg:#1D2A22; --muted:#5D6A62; --line:#DCE2DC;
  --jade:#00843D; --jade-ink:#FFFFFF; --jade-soft:#E1F2E7;
  --red:#DE2027; --red-soft:#FDE2E1;
  --navy:#D9590B; --navy-ink:#FFFFFF;
  --felt:#00843D; --felt-ink:#FFFFFF; --felt-muted:#C5E8D2;
  --shadow:0 1px 0 rgba(0,0,0,.05),0 6px 16px -10px rgba(0,0,0,.25);
  color-scheme:light;
}
:root[data-skin="store"] .center,:root[data-skin="store"] .settle-card{box-shadow:inset 0 -6px 0 #F58220,inset 0 -12px 0 #FFFFFF,inset 0 -18px 0 #DE2027}
:root[data-skin="store"] .settle-card{padding-bottom:28px}
:root[data-skin="store"] .center{padding-bottom:22px}
:root[data-skin="halloween"] header h1::after{content:" 🎃";font-size:20px}
:root[data-skin="halloween"] .center{background-image:radial-gradient(circle at 50% 40%,rgba(255,138,31,.18),transparent 70%)}
:root[data-skin="halloween"] .settle-card{background-image:radial-gradient(circle at 50% 0%,rgba(255,138,31,.16),transparent 60%)}
:root[data-skin="halloween"] .st-title::after{content:" 🦇";font-size:20px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0;letter-spacing:.04em;color:var(--navy)}
header h1{display:flex;align-items:center;gap:8px}
.hlogo{width:34px;height:34px;display:inline-flex;flex:none}
.hlogo img,.flogo img,.splash-logo img{width:100%;height:100%;display:block;object-fit:contain}
header h1 small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-left:6px}
.iconbtn{padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500}

/* table */
.table{display:grid;grid-template-columns:1fr 1.05fr 1fr;grid-template-rows:auto auto auto;gap:8px;grid-template-areas:". s2 ." "s3 c s1" ". s0 ."}
.seat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);min-width:0;position:relative;text-align:center;transition:transform .12s}
.seat:active{transform:scale(.97)}
.seat .wind{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.1;color:var(--fg)}
.seat .name{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .money{font-size:14px;font-weight:700}
.seat .tap{font-size:11px;color:var(--muted)}
.seat.dealer{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft),var(--shadow)}
.badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pos{color:var(--jade)} .neg{color:var(--red)} .zero{color:var(--muted)}
.center{grid-area:c;background:var(--felt);color:var(--felt-ink);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;text-align:center;min-height:118px;
  background-image:radial-gradient(circle at 50% 40%,rgba(255,255,255,.07),transparent 70%)}
.center .rw{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1}
.center .rwl{font-size:12px;letter-spacing:.2em;color:var(--felt-muted);margin-top:2px}
.center .hn{font-size:12px;color:var(--felt-muted);margin-top:6px}
.center .streak{margin-top:4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:999px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:12px 14px;border-radius:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rules{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.rules b{color:var(--fg);font-weight:500}

section h2{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 8px}
.log{display:flex;flex-direction:column;gap:6px}
.hand{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start}
.hand .tag{font-family:var(--f-display);font-weight:900;font-size:15px;background:var(--surface2);border-radius:8px;padding:2px 6px;grid-row:span 2;text-align:center;min-width:44px}
.hand .what{font-weight:700;min-width:0}
.hand .sub{font-size:12px;color:var(--muted);min-width:0}
.hand .deltas{grid-column:2;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px}
.empty{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.banner{background:var(--jade-soft);border-radius:12px;padding:10px 12px;font-size:13px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);max-width:600px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0 0 12px;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
input[type=text],input[type=number]{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
.opt.redon{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.prefix{position:relative}
.prefix span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.prefix input{padding-left:44px}
.hint{font-size:12px;color:var(--muted)}

.fanbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fantotal{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fantotal .big{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.faninput{width:96px!important;padding:6px 10px!important;font-size:28px!important;font-family:var(--f-display)!important;font-weight:900;text-align:left}
.err{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:13px;font-weight:700}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 .btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px}
.grid3 .btn small,.side .grid2 .btn small{font-size:11px;font-weight:500;color:var(--muted)}
.side .grid2 .btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px}
.side .dingrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.side .dingrow .opt{padding:6px 10px;font-size:13px}
.multi-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.multi-row .opt{flex:1}
.multi-row input{width:84px!important;flex:none;text-align:center}
.revenge{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:18px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:700;color:var(--jade)}
.chip.sel{background:var(--jade-soft);border-color:var(--jade)}
.chip .x{color:var(--muted);font-size:14px}
details.cat{border-top:1px solid var(--line)}
details.cat summary{padding:10px 2px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.cat summary::after{content:"＋";color:var(--muted)}
details.cat[open] summary::after{content:"－"}
details.cat .chips{padding-bottom:12px}

.photo{border:1px dashed var(--jade);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.photo .row{display:flex;gap:10px;align-items:center}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ai-out{font-size:13px;background:var(--surface2);border-radius:10px;padding:10px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}

.pay{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.pay .r{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.pay .r small{color:var(--muted);font-size:12px}
.sticky{position:sticky;bottom:0;background:var(--bg);padding-block:10px 4px;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.confirm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ro .edit-only{display:none!important}
body:not(.ro) .view-only{display:none!important}
.ro .seat{cursor:default}
.ro .seat:active{transform:none}
.live{font-size:12px;font-weight:700;color:var(--jade);background:var(--jade-soft);padding:4px 10px;border-radius:999px;letter-spacing:.06em}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.busy .seat,.busy .actions .btn{pointer-events:none;opacity:.6}
.endbtn{width:100%}
.ended #revengeBox,.ended .table,.ended .rules,.ended .actions,.ended .side,.ended .endbtn,.ended .view-only.hint{display:none!important}
.settle{display:flex;flex-direction:column;gap:10px}
.settle-card{background:var(--felt);color:var(--felt-ink);border-radius:18px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px;
  background-image:radial-gradient(circle at 50% 0%,rgba(255,255,255,.10),transparent 60%)}
.st-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.st-title{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.12em}
.st-meta{font-size:12px;color:var(--felt-muted)}
.pl{background:var(--surface);color:var(--fg);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.pl.first{box-shadow:0 0 0 2px #E2B53E}
.rk{font-family:var(--f-display);font-weight:900;font-size:22px;width:30px;text-align:center;color:var(--muted)}
.pl.first .rk{color:#B8860B}
.pname{display:flex;flex-direction:column;min-width:0}
.crown{font-size:22px;line-height:1;margin-bottom:2px}
.pname b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstats{font-size:12px;color:var(--muted)}
.pscore{text-align:right;display:flex;flex-direction:column}
.pscore b{font-size:17px}
.pscore small{font-size:12px;color:var(--muted)}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--fg)}
.tag.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.notag{font-size:12px;color:var(--muted)}
.tagdesc{grid-column:1/-1;font-size:13px;background:var(--jade-soft);border-radius:10px;padding:8px 10px}
.tagdesc b{display:block;font-size:12px;color:var(--jade)}
.share-lines{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.share-lines span b{color:var(--jade)}
.st-foot{font-size:11px;color:var(--felt-muted);text-align:center}
.settle-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.settle-actions .full{grid-column:1/-1}
#shareImg{display:block;width:100%;border-radius:14px;border:1px solid var(--line)}
.st-foot{display:flex;align-items:center;justify-content:center;gap:6px}
.flogo{width:22px;height:22px;display:inline-flex}
.lg-d{display:none!important}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-skin="beige"]):not([data-skin="mist"]):not([data-skin="store"]) .lg-l{display:none!important}
  :root:not([data-theme="light"]):not([data-skin="beige"]):not([data-skin="mist"]):not([data-skin="store"]) .lg-d{display:block!important}
}
:root[data-theme="dark"]:not([data-skin="beige"]):not([data-skin="mist"]):not([data-skin="store"]) .lg-l,:root[data-skin="halloween"] .lg-l{display:none!important}
:root[data-theme="dark"]:not([data-skin="beige"]):not([data-skin="mist"]):not([data-skin="store"]) .lg-d,:root[data-skin="halloween"] .lg-d{display:block!important}
.st-brand{display:flex;align-items:center;gap:10px}
.slogo{width:54px;height:54px;display:inline-flex;flex:none}
.slogo img{width:100%;height:100%;display:block;object-fit:contain}
.st-foot{font-size:12px!important}
/* welcome screen */
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background-image:radial-gradient(circle at 50% 30%,var(--jade-soft),transparent 65%);transition:opacity .35s ease, transform .35s ease}
.splash.leaving{opacity:0;transform:scale(1.03)}
.splash-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;max-width:360px;width:100%}
.splash-logo{width:190px;height:190px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.splash-name{font-family:var(--f-display);font-weight:900;font-size:44px;margin:8px 0 0;color:var(--navy);letter-spacing:.06em;line-height:1.1}
.splash-name span{display:block;font-family:var(--f-body);font-size:16px;font-weight:700;letter-spacing:.3em;color:var(--muted);margin-top:4px}
.splash-go{width:100%;max-width:280px;margin-top:28px;padding:15px;font-size:17px;border-radius:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.splash-logo{animation:none}}
</style>

/* ---------- state ---------- */
const DEFAULT_STATE = () => ({
  v:1, players:["阿明","阿強","阿芬","阿珍"], rate:1, base:5, dealerFan:1, streakFan:2,
  startDealer:0, dealer:0, streak:0, round:0, hands:[], updatedAt:0
});
let state = DEFAULT_STATE();
const KEY = "hktw-mj-standalone";
try{ const o = JSON.parse(localStorage.getItem(KEY) || "null"); if(o && o.v===1) state = Object.assign(DEFAULT_STATE(), o); }catch(e){}
const canWrite = true, saving = false;
function save(){
  state.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------- money logic ---------- */
const seatWind = (p, dealer=state.dealer) => WINDS[(p - dealer + 4) % 4];
const fmt = v => { const a = Math.abs(v); const s = Number.isInteger(a) ? a.toString() : a.toFixed(1); return (v>0?"+":v<0?"−":"") + "$" + s; };
const cls = v => v>0?"pos":v<0?"neg":"zero";

function computeWin(winner, discarder, fan){
  // discarder === null → 自摸, all three pay
  const payers = discarder===null ? [0,1,2,3].filter(p=>p!==winner) : [discarder];
  const deltas = [0,0,0,0], rows = [];
  for(const p of payers){
    const involvesDealer = (winner===state.dealer || p===state.dealer);
    const bonus = involvesDealer ? (state.dealerFan + state.streakFan*state.streak) : 0;
    const total = state.base + fan + bonus;
    const amt = Math.round(total * state.rate * 100)/100;
    deltas[p] -= amt; deltas[winner] += amt;
    rows.push({p, bonus, total, amt});
  }
  return {deltas, rows};
}
function totals(){
  const t=[0,0,0,0];
  state.hands.forEach(h=>h.deltas.forEach((d,i)=>t[i]+=d));
  return t.map(v=>Math.round(v*100)/100);
}
function snap(){ return {dealer:state.dealer, streak:state.streak, round:state.round, revenge: state.revenge ? JSON.parse(JSON.stringify(state.revenge)) : null}; }
function advanceDealer(){
  state.dealer = (state.dealer+1)%4; state.streak = 0;
  if(state.dealer === state.startDealer) state.round++;
}
// list = [{winner, fan, items}] ; more than one entry = 一炮雙響／三響 (discarder pays each winner)
const MULTI = {2:{name:"雙響", fan:5, revenge:10}, 3:{name:"三響", fan:10, revenge:20}};
function recordWins(list, discarder){
  const prev = snap();
  const n = list.length, M = MULTI[n] || null;
  const group = n>1 ? Date.now() : null;
  const R = state.revenge;
  let usedRevenge = false;
  list.forEach((w,i)=>{
    const items = (w.items||[]).slice(); let fan = w.fan;
    if(M){ items.push({name:M.name, fan:M.fan}); fan += M.fan; }
    const {deltas} = computeWin(w.winner, discarder, fan);
    let rev = null;
    if(R && R.from===w.winner){
      const amt = Math.round(R.fan*state.rate*100)/100;
      R.targets.forEach(t=>{ deltas[t] -= amt; deltas[w.winner] += amt; });
      rev = {targets:R.targets.slice(), fan:R.fan}; usedRevenge = true;
    }
    state.hands.push({kind:"win", t:Date.now(), round:state.round, dealer:state.dealer, streak:state.streak,
      winner:w.winner, discarder, fan, items, deltas, revenge:rev, group, groupFirst: i===0, multi: n>1 ? n : 0, prev: i===0 ? prev : null});
  });
  if(usedRevenge) state.revenge = null;
  if(M) state.revenge = {from:discarder, targets:list.map(w=>w.winner), fan:M.revenge};
  if(list.some(w=>w.winner===state.dealer)) state.streak++; else advanceDealer();
  render(); save();
}
function recordWin(winner, discarder, fan, items){ recordWins([{winner, fan, items}], discarder); }
function recordDraw(){
  const prev = snap();
  state.hands.push({kind:"draw", t:Date.now(), round:state.round, dealer:state.dealer, streak:state.streak, deltas:[0,0,0,0], prev});
  state.streak++;
  render(); save();
}
const SIDE = {
  angang:{name:"暗槓", collect:true,  desc:"收三家各 1 底"},
  wai:   {name:"圍骰", collect:true,  desc:"收三家各 1 底"},
  shun:  {name:"順骰", collect:false, desc:"比三家各 1 底"},
  zhahu: {name:"詐糊", collect:false, fan:30, ding:true},
  zhading:{name:"詐叮", collect:false, fan:20, ding:true},
};
const DING = [["無",0],["天叮",60],["地叮",40],["四子叮",20],["七子叮",15],["十子",10]];
let dingIdx = 0;
function sideFan(type){ const S = SIDE[type]; return S.fan ? S.fan + (S.ding ? DING[dingIdx][1] : 0) : state.base; }
function recordSide(type, p){
  const fanEach = sideFan(type);
  const amt = Math.round(fanEach * state.rate * 100)/100;
  const S = SIDE[type];
  const desc = S.fan ? `比三家各 ${fanEach} 番${S.ding && DING[dingIdx][1] ? `（含${DING[dingIdx][0]} ${DING[dingIdx][1]} 番）` : ""}` : S.desc;
  const sign = SIDE[type].collect ? 1 : -1;
  const deltas = [0,0,0,0].map((_,i)=> i===p ? sign*amt*3 : -sign*amt);
  const prev = snap();
  state.hands.push({kind:"side", type, player:p, desc, t:Date.now(), round:state.round, dealer:state.dealer, streak:state.streak, deltas, prev});
  if(S.ding) dingIdx = 0;
  render(); save();
}
function undo(){
  let h = state.hands.pop(); if(!h) return;
  while(h && h.group && !h.groupFirst) h = state.hands.pop();   // 雙響／三響 undo together
  if(!h) return;
  Object.assign(state, h.prev);
  if(!("revenge" in h.prev)) state.revenge = state.revenge || null;
  render(); save();
}

/* ---------- render main ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

const SKINS = [["default","預設"],["beige","米色"],["mist","薄霧"],["store","便利店"],["halloween","萬聖節"]];
function applySkin(){
  const k = state.skin || "default";
  if(k==="default") delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin = k;
}
const isHandStart = h => h.kind!=="side" && !(h.group && !h.groupFirst);
function render(){
  applySkin();
  renderSettle();
  const t = totals();
  const rw = WINDS[state.round % 4];
  const handNo = state.hands.filter(isHandStart).length + 1;
  let html = `<div class="center"><div class="rw">${rw}</div><div class="rwl">${rw}風圈${state.round>=4?` · 第${Math.floor(state.round/4)+1}將`:""}</div>
    <div class="hn">第 ${handNo} 鋪 · ${esc(state.players[state.dealer])} 做莊</div>
    ${state.streak>0?`<div class="streak">連${state.streak} 拉${state.streak}</div>`:""}</div>`;
  for(let p=0;p<4;p++){
    const isD = p===state.dealer;
    html += `<button class="seat${isD?" dealer":""}" style="grid-area:${SEAT_AREA[p]}" data-seat="${p}" aria-label="${esc(state.players[p])} 食糊">
      ${isD?`<span class="badge">莊${state.streak?" 連"+state.streak:""}</span>`:""}
      <span class="wind">${seatWind(p)}</span>
      <span class="name">${esc(state.players[p])}</span>
      <span class="money num ${cls(t[p])}">${fmt(t[p])}</span>
      <span class="tap edit-only">按此食糊</span></button>`;
  }
  $("table").innerHTML = html;
  $("table").querySelectorAll(".seat").forEach(b=>b.onclick=()=>openWin(+b.dataset.seat));

  $("rulesLine").innerHTML = `<span>每番 <b>HK$${state.rate}</b></span><span>底 <b>${state.base}</b> 番</span><span>莊 <b>${state.dealerFan}</b> 番</span><span>每連莊 <b>${state.streakFan}</b> 番</span>`;

  const just = state.hands.length && state.round>0 && state.round%4===0 && state.hands[state.hands.length-1].prev.round !== state.round;
  $("bannerBox").innerHTML = just ? `<div class="banner">北圈已完，打完一將（四圈）。可以繼續打落一將，或到「設定」重新開局。</div>` : "";

  $("undoBtn").disabled = state.hands.length===0;
  const R = state.revenge;
  $("revengeBox").innerHTML = R ? `<div class="revenge">反雪待收：${esc(state.players[R.from])} 下次食糊，會另外收 ${R.targets.map(t=>esc(state.players[t])).join("、")} 各 ${R.fan} 番</div>` : "";
  renderSide();

  const log = $("log");
  if(!state.hands.length){
    log.innerHTML = `<div class="empty">未有記錄。按任何一位玩家記錄食糊，或者按「流局」、暗槓、圍骰、順骰。</div>`;
    return;
  }
  let pu = 0;
  log.innerHTML = state.hands.map((h)=>{
    if(isHandStart(h)) pu++;
    const tag = `${WINDS[h.round%4]}圈<br>${h.kind==="side" ? pu+1 : pu}`;
    if(h.kind==="side"){
      const d = h.deltas.map((v,p)=>v?`<span class="num ${cls(v)}">${esc(state.players[p])} ${fmt(v)}</span>`:"").join("");
      const what = `${esc(state.players[h.player])} ${SIDE[h.type].name}`;
      return `<div class="hand"><span class="tag">${tag}</span><span class="what">${what}</span><span class="sub">${esc(h.desc || SIDE[h.type].desc)}</span><div class="deltas">${d}</div></div>`;
    }
    const dealerTxt = `${esc(state.players[h.dealer])}莊${h.streak?" 連"+h.streak:""}`;
    if(h.kind==="draw") return `<div class="hand"><span class="tag">${tag}</span><span class="what">流局</span><span class="sub">${dealerTxt} · 莊家連莊</span></div>`;
    const how = (h.discarder===null ? "自摸" : `食 ${esc(state.players[h.discarder])} 出銃`) + (h.multi ? `（一炮${MULTI[h.multi].name}）` : "");
    const revTxt = h.revenge ? ` · 反雪收 ${h.revenge.targets.map(t=>esc(state.players[t])).join("、")} 各 ${h.revenge.fan} 番` : "";
    const d = h.deltas.map((v,p)=>v?`<span class="num ${cls(v)}">${esc(state.players[p])} ${fmt(v)}</span>`:"").join("");
    const items = h.items && h.items.length ? " · " + h.items.map(x=>esc(x.name)).join("、") : "";
    return `<div class="hand"><span class="tag">${tag}</span><span class="what">${esc(state.players[h.winner])} ${how} · ${h.fan} 番</span>
      <span class="sub">${dealerTxt}${items}${revTxt}</span><div class="deltas">${d}</div></div>`;
  }).reverse().join("");
}

let sidePlayer = null;
function renderSide(){
  $("sidePlayerSeg").innerHTML = state.players.map((n,i)=>`<button class="opt${i===sidePlayer?" on":""}" data-i="${i}">${esc(n)}</button>`).join("");
  $("sidePlayerSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ sidePlayer = sidePlayer===+b.dataset.i ? null : +b.dataset.i; renderSide(); });
  const amt = Math.round(state.base * state.rate * 100)/100;
  $("dingSeg").innerHTML = DING.map((d,i)=>`<button class="opt${i===dingIdx?" on":""}" data-d="${i}">${d[0]}${d[1]?" "+d[1]:""}</button>`).join("");
  $("dingSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ dingIdx=+b.dataset.d; renderSide(); });
  document.querySelector('[data-side="zhahu"] small').textContent = `比三家各 ${sideFan("zhahu")} 番`;
  document.querySelector('[data-side="zhading"] small').textContent = `比三家各 ${sideFan("zhading")} 番`;
  document.querySelectorAll("[data-side]").forEach(b=>{
    b.disabled = sidePlayer===null;
    b.onclick = ()=>{
      if(sidePlayer===null || !canWrite || saving) return;
      const p = sidePlayer, t = b.dataset.side; sidePlayer = null;
      const each = Math.round(sideFan(t) * state.rate * 100)/100;
      recordSide(t, p);
      $("sideHint").textContent = `已記錄：${state.players[p]} ${SIDE[t].name}，${SIDE[t].collect?"收":"比"}三家各 $${each}。`;
    };
  });
  if(sidePlayer!==null) $("sideHint").textContent = `${state.players[sidePlayer]}：暗槓／圍骰收三家各 $${amt}，順骰比三家各 $${amt}；詐糊／詐叮按掣上番數比三家。`;
}

function resetGame(){
  const keep = {skin:state.skin, players:state.players, rate:state.rate, base:state.base, dealerFan:state.dealerFan, streakFan:state.streakFan, startDealer:state.startDealer};
  state = Object.assign(DEFAULT_STATE(), keep, {dealer:keep.startDealer});
  render(); save();
}

  {id:18, name:"單槓運動員",       desc:"我既目標從來唔係靠食糊。",          test:s=>s.angang>=5},
  {id:19, name:"大老闆",           desc:"大水喉，派人頭。",                  test:s=>s.discards>10 && s.rank>=3},
  {id:20, name:"Sugar Daddy",      desc:"最受歡迎麻雀腳。",                  test:s=>s.rank===4 && s.pts<-500},
];
const r2 = v => Math.round(v*100)/100;
function computeStats(){
  const rate = state.rate > 0 ? state.rate : 1;
  const S = [0,1,2,3].map(p=>({p, pts:0, money:0, wins:0, selfDraws:0, smallWins:0, discards:0, ddh:0, angang:0,
    winFans:[], minRun:0, everNeg:false, started:false, maxConsec:0, cur:0}));
  for(const h of state.hands){
    h.deltas.forEach((d,i)=>{ const s=S[i]; s.money += d; s.pts += d/rate; s.minRun = Math.min(s.minRun, s.pts); if(Math.abs(s.pts) > 1e-9) s.started = true; if(s.started && s.pts <= 1e-9) s.everNeg = true; });
    if(h.kind==="win"){
      const w = S[h.winner]; w.wins++; w.winFans.push(h.fan); if(h.fan<10) w.smallWins++;
      const lead = !h.group || h.groupFirst;
      if(h.discarder===null) w.selfDraws++; else if(lead) S[h.discarder].discards++;
      if((h.items||[]).some(x=>x.name==="對對糊")) w.ddh++;
      if(lead){
        const winners = new Set(h.group ? state.hands.filter(x=>x.group===h.group).map(x=>x.winner) : [h.winner]);
        S.forEach(s=>{ if(winners.has(s.p)){ s.cur++; s.maxConsec=Math.max(s.maxConsec,s.cur); } else s.cur=0; });
      }
    } else if(h.kind==="draw"){ S.forEach(s=>s.cur=0); }
    else if(h.kind==="side" && h.type==="angang"){ S[h.player].angang++; }
  }
  S.forEach(s=>{ s.pts = r2(s.pts); s.money = r2(s.money); s.allPositive = !s.everNeg && s.pts>0; });
  const order = S.slice().sort((a,b)=> b.pts - a.pts || a.p - b.p);
  order.forEach((s,i)=> s.rank = i+1);
  const winsMax = Math.max(...S.map(s=>s.wins));
  S.forEach(s=>{ s.winsMax = winsMax; s.lead = s.rank===1 ? r2(order[0].pts - order[1].pts) : 0; });
  // Each player gets at most 2 titles; a title goes to only one player per game.
  // Titles are handed out in priority order; if several players qualify, the higher-ranked one gets it.
  S.forEach(s=>s.tags=[]);
  const given = new Set();
  for(const t of TAGS){
    if(given.has(t.name)) continue;
    const who = order.find(s=>s.tags.length<2 && t.test(s));
    if(who){ who.tags.push(t); given.add(t.name); }
  }
  return {S, order};
}
let openTag = null;   // "p:id" — only one description shown at a time
function settleHTML(forShare){
  const {order} = computeStats();
  const pu = state.hands.filter(isHandStart).length;
  const d = new Date(state.endedAt || Date.now());
  const date = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  const topPts = order[0].pts;
  const rows = order.map(s=>{
    const first = s.rank===1 && topPts>0;
    const tagsHtml = s.tags.length
      ? s.tags.map(t=>`<button class="tag${openTag===s.p+":"+t.id?" on":""}" data-tag="${s.p}:${t.id}">${esc(t.name)}</button>`).join("")
      : `<span class="notag">未有稱號</span>`;
    let extra = "";
    if(forShare){
      extra = `<div class="share-lines">${s.tags.length ? s.tags.map(t=>`<span><b>${esc(t.name)}</b>　${esc(t.desc)}</span>`).join("") : `<span class="notag">未有稱號</span>`}</div>`;
    } else {
      const ot = openTag && openTag.split(":");
      const t = ot && +ot[0]===s.p ? TAGS.find(x=>x.id===+ot[1]) : null;
      extra = t ? `<div class="tagdesc">${esc(t.desc)}</div>` : "";
    }
    return `<div class="pl${first?" first":""}">
      <div class="rk">${s.rank}</div>
      <div class="pname">${first?`<span class="crown" aria-label="冠軍">👑</span>`:""}<b>${esc(state.players[s.p])}</b>
        <span class="pstats num">食糊 ${s.wins} · 自摸 ${s.selfDraws} · 出銃 ${s.discards}</span></div>
      <div class="pscore num"><b class="${cls(s.money)}">${fmt(s.money)}</b><small>${s.pts>0?"+":""}${s.pts} 番</small></div>
      ${forShare ? "" : `<div class="tags">${tagsHtml}</div>`}
      ${extra}
    </div>`;
  }).join("");
  return `<div class="settle-card">
    <div class="st-head"><span class="st-brand">${forShare?`<span class="slogo">${LOGO_D}</span>`:""}<span class="st-title">結算</span></span><span class="st-meta num">${date} · ${pu} 鋪 · 每番 HK$${state.rate}</span></div>
    ${rows}
    ${forShare?`<div class="st-foot"><span class="flogo">${LOGO_D}</span>番鼠 · 港台麻雀計番</div>`:""}
  </div>`;
}
function renderSettle(){
  const ended = !!state.ended;
  document.body.classList.toggle("ended", ended);
  $("settle").hidden = !ended;
  if(!ended) return;
  $("settleCard").innerHTML = settleHTML(false);
  $("settleCard").querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{
    openTag = openTag===b.dataset.tag ? null : b.dataset.tag; renderSettle();
  });
}
$("endBtn").onclick = ()=>{ if(!canWrite || saving) return; state.ended = true; state.endedAt = Date.now(); openTag=null; render(); save(); window.scrollTo(0,0); };
$("backBtn").onclick = ()=>{ if(!canWrite || saving) return; state.ended = false; render(); save(); };
let newArmed = false;
$("newGameBtn").onclick = ()=>{
  if(!canWrite || saving) return;
  if(!newArmed){ newArmed = true; $("newGameBtn").textContent = "再按一次確認"; return; }
  newArmed = false; resetGame();
};

/* share image */
let h2cPromise = null, downloadsNs = null, shareBlob = null;
function loadH2C(){
  if(window.html2canvas) return Promise.resolve();
  if(!h2cPromise) h2cPromise = new Promise((ok,bad)=>{
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    sc.onload = ok; sc.onerror = ()=>{ h2cPromise=null; bad(); };
    document.head.appendChild(sc);
  });
  return h2cPromise;
}
$("shareBtn").onclick = async ()=>{
  showSheet($("shareSheet"));
  $("shareImg").hidden = true;
  $("shareHint").textContent = "製作圖片中…";
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;width:400px;padding:12px;background:var(--bg)";
  holder.innerHTML = settleHTML(true);
  document.body.appendChild(holder);
  try{
    await loadH2C();
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const bg = getComputedStyle(document.body).backgroundColor;
    const canvas = await window.html2canvas(holder, {scale:2, backgroundColor:bg, logging:false, useCORS:true});
    $("shareImg").src = canvas.toDataURL("image/png"); $("shareImg").hidden = false;
    
    $("shareHint").textContent = "長按圖片可以儲存或者直接分享俾朋友。";
  }catch(e){
    $("shareHint").textContent = "暫時整唔到圖片，可以直接用手機截圖分享。";
  }finally{ holder.remove(); }
};
$("closeShare").onclick = hideSheet;

/* ---------- sheets ---------- */
let openSheet = null;
function showSheet(el){ openSheet = el; $("scrim").hidden = false; el.hidden = false; el.scrollTop = 0; }
function hideSheet(){ const was = openSheet; if(openSheet) openSheet.hidden = true; openSheet = null; $("scrim").hidden = true; }
$("scrim").onclick = hideSheet;

/* setup */
let resetArmed = false;
function fillSetup(){
  for(let i=0;i<4;i++) $("p"+i).value = state.players[i];
  $("rate").value = state.rate; $("base").value = state.base; $("dealerFan").value = state.dealerFan; $("streakFan").value = state.streakFan;
  const locked = state.hands.length>0;
  $("startDealerSeg").innerHTML = state.players.map((n,i)=>`<button class="opt${i===state.startDealer?" redon":""}" data-i="${i}" ${locked?"disabled":""}>${esc(n)}</button>`).join("");
  $("startDealerSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(state.hands.length) return; state.startDealer = state.dealer = +b.dataset.i; state.streak=0; state.round=0; save(); fillSetup(); render(); });
  $("startDealerHint").textContent = locked ? "已開始記錄，要改開局莊家請先重新開局。" : "開局莊家坐東風位，之後按逆時針過莊。";
  resetArmed=false; $("resetBtn").textContent = "清除所有記錄，重新開局";
  const cur = state.skin || "default";
  $("skinSeg").innerHTML = SKINS.map(([k,n])=>`<button class="opt${k===cur?" on":""}" data-k="${k}">${n}</button>`).join("");
  $("skinSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ state.skin = b.dataset.k; applySkin(); save(); fillSetup(); });
}
$("openSetup").onclick = ()=>{ fillSetup(); showSheet($("setupSheet")); };
$("closeSetup").onclick = hideSheet;
for(let i=0;i<4;i++) $("p"+i).addEventListener("change", e=>{ state.players[i] = e.target.value.trim() || `玩家${i+1}`; render(); save(); fillSetup(); });
[["rate",0.1],["base",0],["dealerFan",0],["streakFan",0]].forEach(([k])=>$(k).addEventListener("change", e=>{ const v = parseFloat(e.target.value); if(!isNaN(v) && v>=0){ state[k]=v; render(); save(); } else e.target.value = state[k]; }));
$("resetBtn").onclick = ()=>{
  if(!resetArmed){ resetArmed=true; $("resetBtn").textContent = "再按一次確認清除"; return; }
  resetGame(); fillSetup();
};

/* draw / undo */
$("drawBtn").onclick = ()=>{ if(canWrite && !saving) recordDraw(); };
$("undoBtn").onclick = ()=>{ if(canWrite && !saving) undo(); };

/* win sheet */
let ws = null;
function openWin(winner){
  if(!canWrite || saving || state.ended) return;
  ws = {winner, discarder:null, items:[], adj:0, photo:null, extra:{}};
  $("winErr").hidden = true;
  buildCatalog();
  renderWin();
  showSheet($("winSheet"));
}
function fanTotal(){ return Math.max(0, ws.items.reduce((a,b)=>a+b.fan,0) + ws.adj); }
function renderWin(){
  const w = ws.winner;
  $("winTitle").textContent = `${state.players[w]} 食糊（${seatWind(w)}位${w===state.dealer?"・莊":""}）`;
  $("winnerSeg").innerHTML = state.players.map((n,i)=>`<button class="opt${i===w?" on":""}" data-i="${i}">${esc(n)}</button>`).join("");
  $("winnerSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ ws.winner=+b.dataset.i; if(ws.discarder===ws.winner) ws.discarder = [0,1,2,3].find(p=>p!==ws.winner); renderWin(); });
  const self = ws.discarder===null;
  $("modeSeg").innerHTML = `<button class="opt${self?" on":""}" data-m="self">自摸（三家找）</button><button class="opt${!self?" on":""}" data-m="d">食出銃</button>`;
  $("modeSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ ws.discarder = b.dataset.m==="self" ? null : (ws.discarder ?? [0,1,2,3].find(p=>p!==ws.winner)); if(b.dataset.m!=="self" && ws.discarder===null) ws.discarder=[0,1,2,3].find(p=>p!==ws.winner); renderWin(); });
  $("discarderField").hidden = self;
  $("multiField").hidden = self;
  if(self) ws.extra = {};
  else {
    Object.keys(ws.extra).forEach(k=>{ if(+k===w || +k===ws.discarder) delete ws.extra[k]; });
    const others = [0,1,2,3].filter(p=>p!==w && p!==ws.discarder);
    $("multiList").innerHTML = others.map(p=>{ const on = p in ws.extra;
      return `<div class="multi-row"><button class="opt${on?" on":""}" data-mp="${p}">${esc(state.players[p])}${on?" 都食":""}</button>${on?`<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" data-mf="${p}" value="${ws.extra[p]||""}" placeholder="番數" aria-label="${esc(state.players[p])} 番數">`:""}</div>`; }).join("");
    $("multiList").querySelectorAll("[data-mp]").forEach(b=>b.onclick=()=>{ const p=+b.dataset.mp; if(p in ws.extra) delete ws.extra[p]; else ws.extra[p]=0; renderWin(); });
    $("multiList").querySelectorAll("[data-mf]").forEach(inp=>{
      inp.addEventListener("beforeinput", e=>{ if(e.data && /[^0-9]/.test(e.data)) e.preventDefault(); });
      inp.addEventListener("input", e=>{ const c=e.target.value.replace(/[^0-9]/g,"").replace(/^0+(?=[0-9])/,"").slice(0,4); if(e.target.value!==c) e.target.value=c; ws.extra[+e.target.dataset.mf] = c===""?0:parseInt(c,10); renderPay(); });
    });
  }
  if(!self){
    $("discarderSeg").innerHTML = [0,1,2,3].filter(p=>p!==w).map(p=>`<button class="opt${p===ws.discarder?" redon":""}" data-i="${p}">${esc(state.players[p])}</button>`).join("");
    $("discarderSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ ws.discarder=+b.dataset.i; renderWin(); });
  }
  // fan
  if(document.activeElement !== $("fanInput")) $("fanInput").value = fanTotal();
  if(fanTotal() > 0) $("winErr").hidden = true;
  const selHtml = ws.items.map((it,i)=>`<button class="chip sel" data-i="${i}">${esc(it.name)} <b>${it.fan}</b><span class="x">✕</span></button>`).join("")
    + (ws.adj ? `<button class="chip sel" data-adj="1">手動調整 <b>${ws.adj>0?"+":""}${ws.adj}</b><span class="x">✕</span></button>` : "");
  $("selChips").innerHTML = selHtml || `<span class="hint">揀下面番種，或用 ＋／− 直接加減番數。</span>`;
  $("selChips").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.dataset.adj) ws.adj=0; else ws.items.splice(+b.dataset.i,1); renderWin(); });
  renderPay();
}
function winList(){
  return [{winner:ws.winner, fan:fanTotal()}].concat(Object.keys(ws.extra).map(k=>({winner:+k, fan:ws.extra[k]||0})));
}
function renderPay(){
  const list = winList(), M = MULTI[list.length];
  let html = `<div class="lbl" style="margin-bottom:4px">找數${M?`（一炮${M.name}，每位食糊 +${M.fan} 番）`:""}</div>`;
  const R = state.revenge;
  list.forEach(x=>{
    const fan = x.fan + (M ? M.fan : 0);
    const {rows} = computeWin(x.winner, ws.discarder, fan);
    let sum = rows.reduce((a,r)=>a+r.amt,0);
    html += rows.map(r=>`<div class="r"><span>${esc(state.players[r.p])} 俾 ${list.length>1?esc(state.players[x.winner])+" ":""}<small>底${state.base} + ${fan}番${r.bonus?` + 莊${r.bonus}`:""} = ${r.total}番</small></span><span class="neg">−$${r.amt}</span></div>`).join("");
    if(R && R.from===x.winner){
      const amt = Math.round(R.fan*state.rate*100)/100;
      html += R.targets.map(t=>`<div class="r"><span>${esc(state.players[t])} 俾 <small>反雪 ${R.fan}番</small></span><span class="neg">−$${amt}</span></div>`).join("");
      sum += amt*R.targets.length;
    }
    html += `<div class="r" style="border-top:1px solid var(--line);padding-top:6px;margin:2px 0 6px"><b>${esc(state.players[x.winner])} 收</b><b class="pos">+$${Math.round(sum*100)/100}</b></div>`;
  });
  if(M) html += `<div class="hint">記錄後：${esc(state.players[ws.discarder])} 下次食糊會反雪，收 ${list.map(x=>esc(state.players[x.winner])).join("、")} 各 ${M.revenge} 番。</div>`;
  $("payBox").innerHTML = html;
}
function buildCatalog(){
  $("catalog").innerHTML = CATALOG.map((c,ci)=>`<details class="cat"><summary>${c.g}</summary><div class="chips">${
    c.items.map((it,ii)=>`<button class="chip" data-c="${ci}" data-i="${ii}" title="${esc(it[2])}">${esc(it[0])} <b>${it[1]}</b></button>`).join("")}</div></details>`).join("");
  $("catalog").querySelectorAll("button.chip").forEach(b=>b.onclick=()=>{
    const it = CATALOG[+b.dataset.c].items[+b.dataset.i];
    ws.items.push({name:it[0], fan:it[1]}); renderWin();
  });
}
$("fanPlus").onclick = ()=>{ ws.adj++; renderWin(); };
$("fanInput").addEventListener("beforeinput", e=>{ if(e.data && /[^0-9]/.test(e.data)) e.preventDefault(); });
$("fanInput").addEventListener("input", e=>{
  const el = e.target, clean = el.value.replace(/[^0-9]/g,"").replace(/^0+(?=[0-9])/,"").slice(0,4);
  if(el.value !== clean) el.value = clean;
  const n = clean === "" ? 0 : parseInt(clean,10);
  ws.adj = n - ws.items.reduce((a,b)=>a+b.fan,0);
  renderWin();
});
$("fanInput").addEventListener("focus", e=>e.target.select());
$("fanInput").addEventListener("blur", ()=>renderWin());
$("fanInput").addEventListener("keydown", e=>{ if(e.key==="Enter") e.target.blur(); });
$("fanMinus").onclick = ()=>{ ws.adj--; if(fanTotal()===0 && ws.adj<0 && ws.items.length===0) ws.adj=0; renderWin(); };
$("cancelWin").onclick = hideSheet;
$("confirmWin").onclick = ()=>{
  if(fanTotal() <= 0){
    $("winErr").textContent = "未輸入番數。請揀番種、按 ＋，或直接輸入番數。";
    $("winErr").hidden = false; $("fanInput").focus(); return;
  }
  const missing = Object.keys(ws.extra).filter(k=>!(ws.extra[k]>0));
  if(missing.length){
    $("winErr").textContent = `請輸入 ${missing.map(k=>state.players[k]).join("、")} 嘅番數。`;
    $("winErr").hidden = false; return;
  }
  const items = ws.items.slice(); if(ws.adj) items.push({name:"手動調整", fan:ws.adj});
  const list = [{winner:ws.winner, fan:fanTotal(), items}].concat(Object.keys(ws.extra).map(k=>({winner:+k, fan:ws.extra[k], items:[]})));
  recordWins(list, ws.discarder);
  hideSheet();
};

render();
</script>
