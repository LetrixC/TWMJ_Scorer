const WD = "日一二三四五六";
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };

const MAJI_IMG = "fs-f233e4dc1c9f.jpg";

const plainTxt = t => t.replace(/\*/g, "");
// WhatsApp／Signal：手機支援就連插圖一齊分享（系統分享面板揀 app）；唔支援就淨係文字，連結預覽會顯示插圖
async function shareWithPic(text, url, fallback){
  const f = await majiFile();
  let can = false; try{ can = !!(f && navigator.canShare && navigator.canShare({files:[f], text})); }catch(e){}
  if(can){
    try{ await navigator.clipboard.writeText(text); }catch(e){}
    try{ await navigator.share({files:[f], text}); toast("如果 app 冇帶到文字，直接貼上就得（已複製）。"); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  fallback();
}

const todayYmd = () => ymd(new Date());
const b64u = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = t => JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/")))));

function yPeople(y, d){
  return Object.entries(y.people || {}).map(([k,p])=>Object.assign({k}, p))
    .filter(p=>p.st!=="no" && (!d || (p.dates || []).includes(d)))
    .sort((a,b)=>(a.k===y.host ? -1 : b.k===y.host ? 1 : 0) || (a.at||0) - (b.at||0));
}

// 我喺邊幾日有份（約局者：全部日子）
function myDates(y){
  const u = meUid(); if(!u) return [];
  if(y.host===u) return y.dates || [];
  const p = (y.people || {})[u];
  return p && p.st!=="no" ? (p.dates || []).filter(d=>(y.dates || []).includes(d)) : [];
}
// members：約局者 + 有報名（最少一日）嘅帳戶
function yMembers(y, people){
  return [y.host].concat(Object.entries(people).filter(([k,p])=>!isGuestKey(k) && k!==y.host && p.st!=="no" && (p.dates || []).length).map(([k])=>k));

// 行事曆：iPhone 用 .ics；Google 用新增活動連結
const hkUTC = (date, time, addH=0) => { const [h,m] = time.split(":").map(Number); const d = parseYmd(date); const t = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), h - 8 + addH, m); return new Date(t).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); };
function icsFor(y, dates){
  const ev = dates.map(d=>["BEGIN:VEVENT", `UID:${y.id}-${d}@fansyu`, `DTSTAMP:${hkUTC(ymd(new Date()),"12:00")}`, `DTSTART:${hkUTC(d,y.time)}`, `DTEND:${hkUTC(d,y.time,4)}`,
    `SUMMARY:番鼠約局（${y.hostName}）`, `DESCRIPTION:${y.host===meUid()?"你":y.hostName} 發起嘅麻雀局。詳情：${y.legacy ? SITE : inviteURL(y)}`, "END:VEVENT"].join("\r\n"));
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FanSyu//TC","CALSCALE:GREGORIAN"].concat(ev, ["END:VCALENDAR"]).join("\r\n");
}
function addToApple(y, dates){
  if(!dates || !dates.length){ toast("請先揀日子。"); return; }
  const ics = icsFor(y, dates);
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)){ location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"})); a.download = "番鼠約局.ics";
  document.body.appendChild(a); a.click(); a.remove();
}
const googleURL = (y, d) => "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(`番鼠約局（${y.hostName}）`) +
  "&dates=" + hkUTC(d, y.time) + "/" + hkUTC(d, y.time, 4) + "&ctz=Asia/Hong_Kong&details=" + encodeURIComponent(`${y.hostName} 發起嘅麻雀局。詳情：${y.legacy ? SITE : inviteURL(y)}`);

/* 我嘅約局：即時監聽 yue（members 有我） */
function startYueWatch(){
  stopYueWatch();
  if(!ONLINE.user || !ONLINE.backend.yueWatchMine) return;
  const uid = ONLINE.user.uid;
  ONLINE.yueUnsub = ONLINE.backend.yueWatchMine(uid, list=>{
    if(!ONLINE.user || ONLINE.user.uid!==uid) return;
    if(list===null){ ONLINE.yueErr = true; return; }
    ONLINE.yueErr = false;
    ONLINE.yueList = list;
    yueAutoJoin();
    if(!$("lobby").hidden) renderLobby();
    if(openSheet && openSheet.id==="yueDaySheet") renderYueDay();
  });
}
function stopYueWatch(){ if(ONLINE.yueUnsub){ try{ ONLINE.yueUnsub(); }catch(e){} } ONLINE.yueUnsub = null; ONLINE.yueList = []; }
const findYue = id => (ONLINE.yueList || []).find(y=>y.id===id) || (ONLINE.yueIn && ONLINE.yueIn.id===id ? ONLINE.yueIn : null);

// 約局者開咗房：有報名嗰日嘅帳戶自動入房（12 個鐘內開嘅房先會自動入）
function yueAutoJoin(){
  const u = meUid(); if(!u) return;
  let done = []; try{ done = JSON.parse(localStorage.getItem("fansyu-yue-rooms-" + u) || "[]"); }catch(e){}
  const mark = c => { done.push(c); try{ localStorage.setItem("fansyu-yue-rooms-" + u, JSON.stringify(done.slice(-50))); }catch(e){} };
  for(const y of ONLINE.yueList || []){
    if(y.host===u) continue;
    for(const d of myDates(y)){
      const r = (y.rooms || {})[d];
      if(!r || !r.code || done.includes(r.code) || Date.now() - (r.at || 0) > 12*3600e3) continue;
      mark(r.code);
      if(ONLINE.room){ if(ONLINE.room!==r.code) toast(`${y.hostName} 開咗房 ${r.code}，可以喺日曆入房。`); continue; }
      joinRoom(r.code).then(()=>toast(`已自動加入 ${y.hostName} 嘅房間 ${r.code}。`)).catch(e=>toast(e.message && !e.code ? e.message : errText(e)));
      return;
    }
  }
}

/* 約局者動作 */
async function yueHostSave(y, data, okMsg){
  try{ await ONLINE.backend.yueHost(y.id, data); if(okMsg) toast(okMsg); return true; }
  catch(e){ toast("改唔到約局：" + errText(e)); return false; }
}
function yueRemovePerson(y, k, d){
  const p = (y.people || {})[k]; if(!p) return;
  askConfirm(`移除 ${p.name}？`, `${p.name} 會喺 ${dayTxt(d)} 嘅報名名單消失。`, "移除", async ()=>{
    const people = Object.assign({}, y.people);
    const left = (p.dates || []).filter(x=>x!==d);
    if(left.length) people[k] = Object.assign({}, p, {dates:left}); else delete people[k];
    await yueHostSave(y, {people, members:yMembers(y, people)}, `已移除 ${p.name}。`);
  });
}
function yueDelete(y){
  askConfirm("刪除呢個約局？", "所有報名都會一齊刪除，朋友條邀請連結亦會失效。刪除咗就冇得還原。", "刪除約局", async ()=>{
    try{ await ONLINE.backend.yueDelete(y.id); toast("已刪除約局。"); hideSheet(); liftReset(); }
    catch(e){ toast("刪除唔到：" + errText(e)); }

}

/* 報名者動作（已登入） */
async function yueRespond(y, dates, d){
  const u = ONLINE.user; if(!u) return;
  const prev = (y.people || {})[u.uid];
  const go = async () => {
    const entry = dates.length ? {name:u.name, uid:u.uid, dates:dates.slice().sort(), st:"in", at:(prev && prev.st!=="no" && prev.at) || Date.now()}
      : {name:u.name, uid:u.uid, dates:[], st:"no", at:Date.now()};
    try{ await ONLINE.backend.yueSelf(y.id, u.uid, entry, !!dates.length); toast(dates.length ? "已報名，約局已加入你嘅日曆。" : "已回覆唔得閒。"); return true; }
    catch(e){ toast("報唔到名：" + errText(e)); return false; }
  };
  if(d && !dates.length){
    // 喺日曆撳「取消報名」：只係取消嗰日
    const left = myDates(y).filter(x=>x!==d);
    askConfirm("取消報名？", `你會喺 ${dayTxt(d)} 嘅報名名單消失。`, "取消報名", async ()=>{ dates = left; await go(); if(!left.length){ hideSheet(); liftReset(); } });
    return;
  }
  return go();
}

/* 快速約局／改日期時間：揀未來 31 日（可以揀多日） */
let yuePick = new Set();
function openYuePicker(edit){
  ONLINE.yueEdit = edit || null;
  yuePick = new Set(edit ? upDates(edit) : []);
  $("yueTitle").textContent = edit ? "改約局日期／時間" : "快速約局";
  $("yueTime").value = edit ? edit.time : "20:00";
  $("yueOk").textContent = edit ? "儲存" : "確認";
  renderYuePicker(); showSheet($("yueSheet"));
}
function renderYuePicker(){
  const today = new Date(new Date().toDateString());
  const days = [...Array(32).keys()].map(i=>new Date(today.getFullYear(), today.getMonth(), today.getDate()+i));
  let html = "", curM = -1;
  for(const d of days){
    if(d.getMonth()!==curM){
      if(curM!==-1) html += `</div>`;
      curM = d.getMonth();
      html += `<div class="pk-month">${d.getFullYear()} 年 ${d.getMonth()+1} 月</div><div class="cal-grid pk">${[..."日一二三四五六"].map(w=>`<b>${w}</b>`).join("")}`;
      for(let i=0;i<d.getDay();i++) html += `<span></span>`;
    }
    const k = ymd(d);
    html += `<button type="button" class="cd pkd${yuePick.has(k)?" on":""}${k===ymd(today)?" today":""}" data-day="${k}">${d.getDate()}</button>`;
  }
  html += `</div>`;
  $("yueCal").innerHTML = html;
  $("yueCal").querySelectorAll("[data-day]").forEach(b=>b.onclick = () => { const k = b.dataset.day; if(yuePick.has(k)) yuePick.delete(k); else yuePick.add(k); renderYuePicker(); });
  $("yueChosen").textContent = yuePick.size ? "已揀：" + [...yuePick].sort().map(dayTxt).join("、") : "撳日子揀（可以揀多日）";
  $("yueOk").disabled = !yuePick.size;
}
async function confirmYue(){
  if(!yuePick.size || !ONLINE.user) return;
  const dates = [...yuePick].sort(), time = $("yueTime").value || "20:00", u = ONLINE.user;
  $("yueOk").disabled = true;
  try{
    const ed = ONLINE.yueEdit;
    if(ed){
      // 改期：原本一日改去另一日，報名跟住搬；其他情況保留仲喺新日子入面嘅報名
      const old = ed.dates || [], move = old.length===1 && dates.length===1 && old[0]!==dates[0];
      const people = {};
      for(const [k,p] of Object.entries(ed.people || {})){
        const nd = k===ed.host ? dates : move ? ((p.dates || []).includes(old[0]) ? dates.slice() : []) : (p.dates || []).filter(x=>dates.includes(x));
        people[k] = Object.assign({}, p, {dates:nd});
      }
      const rooms = {}; for(const [k,r] of Object.entries(ed.rooms || {})) if(dates.includes(k)) rooms[k] = r;
      if(await yueHostSave(ed, {dates, time, people, members:yMembers(ed, people), rooms}, "已更新約局，報名嘅朋友會見到新日期時間。")){ hideSheet(); liftReset(); }
    } else {
      const data = {host:u.uid, hostName:u.name, dates, time, people:{[u.uid]:{name:u.name, uid:u.uid, dates, st:"in", at:Date.now()}},
        members:[u.uid], rooms:{}, createdAt:Date.now(), updatedAt:Date.now()};
      const id = await ONLINE.backend.yueCreate(data);
      hideSheet(); liftReset();
      openYueShare(Object.assign({id}, data));
    }
  }catch(e){ toast("儲存唔到約局：" + errText(e)); }
  finally{ $("yueOk").disabled = !yuePick.size; }
}

async function shareYue(kind){

  const url = inviteURL(y), text = inviteText(y);
  if(kind==="wa") return shareWithPic(text, url, () => window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank"));

  if(kind==="copy"){ try{ await navigator.clipboard.writeText(text); toast("已複製邀請。"); }catch(e){ prompt("複製呢段：", text); } return; }

// 分享圖用嘅 QR 顏色：跟主題，但一定係深色（白底先掃到）
function qrInk(){
  const cs = getComputedStyle(document.documentElement);
  for(const v of ["--head","--fg","--navy","--felt"]){ const c = cs.getPropertyValue(v).trim(); if(/^#[0-9a-f]{6}$/i.test(c)){ const n = parseInt(c.slice(1),16), L = (0.2126*(n>>16) + 0.7152*((n>>8)&255) + 0.0722*(n&255))/255; if(L < 0.45) return c; } }
  return "#1A1A1A";
}
const ivSparks = () => document.documentElement.dataset.skin==="royal" ? `<span class="iv-spark" style="top:8px;left:10px">✦</span><span class="iv-spark" style="top:8px;right:10px">✦</span><span class="iv-spark" style="bottom:8px;left:10px">✦</span><span class="iv-spark" style="bottom:8px;right:10px">✦</span>` : "";

/* ---------- 經驗值同等級 ---------- */
const XP = {minHands:8, join:10, perHand:40, perGame:300, hkMult:4, maxLv:100};
const xpNeed = L => Math.round(16 + 1.52 * Math.pow(L-1, 1.4));          // 由 L 級升 L+1 級要幾多經驗
const LV_TITLES = ["初出茅廬","街坊雀友","茶樓常客","雀館熟客","雀壇好手","一方雀霸","雀林高手","雀聖門生","雀聖","雀神"];
function levelOf(total){
  let lv = 1, rest = Math.max(0, total||0);
  while(lv < XP.maxLv && rest >= xpNeed(lv)){ rest -= xpNeed(lv); lv++; }
  const max = lv >= XP.maxLv;
  return {lv, into: max ? 0 : rest, need: max ? 0 : xpNeed(lv), max, title: max ? "登峰造極" : LV_TITLES[Math.floor(lv/10)]};
}
function lvBadge(total, small){ const L = levelOf(total); return `<span class="lvb${L.max?" lvmax":""}${small?" sm":""}">Lv ${L.lv}${small?"":" · "+L.title}</span>`; }
// 一場嘅經驗：合資格先有；參與獎 + 每鋪食糊番數（廣東牌 ×4，每鋪最多 40），每場最多 300
function xpCheck(){
  const u = state.uids || [];
  if(!ONLINE.room) return {ok:false, why:"單機模式唔計經驗"};
  if(u.length<4 || u.some(x=>!x)) return {ok:false, why:"要四個座位都係有帳戶嘅玩家先計經驗"};
  if(new Set(u).size < 4) return {ok:false, why:"同一個帳戶坐咗兩個位，今場唔計經驗"};
  const n = state.hands.filter(isHandStart).length;
  if(n < XP.minHands) return {ok:false, why:`最少要打 ${XP.minHands} 鋪先計經驗（今場 ${n} 鋪）`};
  return {ok:true};
}
function xpForGame(){
  const chk = xpCheck(), xp = [0,0,0,0];
  if(!chk.ok) return {chk, xp};
  for(let p=0;p<4;p++){
    let sum = 0;
    for(const h of state.hands){
      if(h.kind!=="win" || h.winner!==p) continue;
      const f = isPM() ? 10 + Math.min(h.fan, state.pm.cap) * 10 : isHK() ? Math.min(h.fan, state.hk.cap) * XP.hkMult : h.fan;
      sum += Math.min(XP.perHand, Math.max(0, f));
    }
    xp[p] = Math.min(XP.perGame, XP.join + sum);
  }
  return {chk, xp};
}
const totalXp = () => (ONLINE.games || []).reduce((a,g)=>a+(g.xp||0), 0);
function checkLevelUp(){
  if(!ONLINE.user || ONLINE.games===null) return;
  const total = totalXp(), L = levelOf(total), key = "fansyu-lv-" + ONLINE.user.uid;
  let prev = null; try{ prev = +localStorage.getItem(key) || null; }catch(e){}
  try{ localStorage.setItem(key, L.lv); }catch(e){}
  if(prev && L.lv > prev) showLevelUp(prev, L);
  ONLINE.backend.saveProfile(ONLINE.user.uid, {name:ONLINE.user.name, xp:total, lv:L.lv}).catch(()=>{});
}
function showLevelUp(from, L){
  const el = document.createElement("div");
  el.className = "lvup";
  el.innerHTML = `<div class="lvup-card${L.max?" lvmax":""}"><div class="lvup-k">升級！</div><div class="lvup-n">Lv ${from} → ${L.lv}</div><div class="lvup-t">${esc(L.title)}</div><button class="btn primary">好嘢</button></div>`;
  document.body.appendChild(el);
  el.querySelector("button").onclick = () => el.remove();
}

/* ---------- settlement → 小氣簿 ---------- */
function buildRecords(){
  const {S} = computeStats();
  const G = xpForGame();
  const uids = state.uids || [];
  if(!state.gameId) state.gameId = newGameId();
  const gameId = ONLINE.room + "_" + state.gameId;
  const hands = state.hands.filter(isHandStart).length;
  return [0,1,2,3].filter(p=>uids[p]).map(p=>{
    const s = S[p];
    return {uid:uids[p], gameId, data:{
      gameId, room:ONLINE.room, endedAt:state.endedAt || Date.now(), mode:state.mode, name:state.players[p], hands,
      rank:s.rank, money:s.money, pts:s.pts, tags:s.tags.map(t=>t.name), gold:s.tags.some(t=>t.id===1),
      special: s.special ? {id:s.special.t.id, name:s.special.t.name, tier:s.special.t.tier} : null,
      vs:[0,1,2,3].filter(q=>q!==p).map(q=>({uid:uids[q] || null, name:state.players[q], money:s.vs[q]})),
      xp: G.xp[p],
    }};
  });
}
async function sendRecords(){
  const mem = (ONLINE.roomDoc && ONLINE.roomDoc.members) || {};
  if(totals().every(v=>Math.abs(v)<0.005)){ toast("今場冇輸冇贏（打和），唔會記入小氣簿。"); return; }
  const all = buildRecords(), list = all.filter(r=>r.uid in mem);
  if(all.length > list.length) setTimeout(()=>toast(`有 ${all.length - list.length} 位玩家未入房，今場唔會記入佢哋嘅小氣簿。`), 3400);
  if(!list.length){ toast("冇玩家揀咗帳戶，今場唔會記入小氣簿。可以喺「房間」分配座位。"); return; }
  try{
    await ONLINE.backend.saveRecords(list);
    toast(`已記入 ${list.length} 位玩家嘅小氣簿。`);
    ONLINE.profiles = {};
    if(list.some(x=>x.uid===ONLINE.user.uid)) loadGames();
  }catch(e){ toast("記錄唔到小氣簿：" + errText(e)); }
}
{
  window.__afterEnd = () => { if(ONLINE.room && ONLINE.isHost && state.ended){ onlinePush(); sendRecords(); } };
  // 房間入面：結算後「返回大廳」（所有人都見到）；之後返入房間會見返結算，直至房主重新開局
  const backBtn = $("backBtn"), origBack = backBtn.onclick;
  backBtn.onclick = () => { if(ONLINE.room){ leaveRoom(); return; } origBack(); };
  const origSettle = renderSettle;
  renderSettle = function(){
    origSettle();
    const bb = $("backBtn");
    if(bb){ bb.textContent = ONLINE.room ? "返回大廳" : "返回牌局"; bb.classList.toggle("edit-only", !ONLINE.room); }
    if(!ONLINE.room || !state.ended) return;
    const G = xpForGame();
    const rows = $("settleCard").querySelectorAll(".pl");
    const {order} = computeStats();
    rows.forEach((row,i)=>{
      const p = order[i].p;
      const d = document.createElement("div"); d.className = "xpline";
      d.innerHTML = G.chk.ok ? `<b>+${G.xp[p]}</b> 經驗` : "";
      if(G.chk.ok) row.appendChild(d);
    });
    if(!G.chk.ok){ const n = document.createElement("p"); n.className = "xpnote"; n.textContent = G.chk.why; $("settleCard").querySelector(".settle-card").appendChild(n); }
  };
  const origReset = resetGame;
  resetGame = function(){
    const keepU = state.uids;
    origReset();
    if(ONLINE.room){ state.uids = keepU; state.gameId = newGameId(); render(); save(); }
  };
}

/* ---------- 小氣簿 ---------- */
async function loadGames(){
  if(!ONLINE.user) return;
  try{ ONLINE.games = await ONLINE.backend.myGames(ONLINE.user.uid); ONLINE.gamesErr = false; checkLevelUp(); }
  catch(e){ ONLINE.gamesErr = true; }
  if(!$("lobby").hidden) renderLobby();
  if(openSheet && openSheet.id==="ledgerSheet") renderLedger();
}
function liftReset(){ $("scrim").style.zIndex = ""; document.querySelectorAll(".sheet").forEach(x=>x.style.zIndex = ""); }
{
  const baseShow = showSheet;
  showSheet = function(el){ baseShow(el); if($("lobby") && !$("lobby").hidden){ $("scrim").style.zIndex = 46; el.style.zIndex = 47; } };
}
function openLite(){
  const inRoom = !!(ONLINE.room && ONLINE.user);
  $("liteNameField").hidden = !inRoom;
  if(inRoom) $("liteName").value = (ONLINE.roomDoc && ONLINE.roomDoc.members && ONLINE.roomDoc.members[ONLINE.user.uid]) || ONLINE.user.name;
  $("liteNote").textContent = inRoom ? "番數同牌局設定只有房主可以改。" : "番數同牌局設定喺開房或者單機牌局入面嘅「設定」度改。";
  $("liteSkin").innerHTML = skinButtonsHTML();
  $("liteSkin").querySelectorAll("button").forEach(b=>b.onclick = () => chooseSkin(b.dataset.k, openLite));
  $("litePay").hidden = !ONLINE.user;
  if(ONLINE.user && document.activeElement!==$("litePayme") && document.activeElement!==$("liteFps")){ const me = ONLINE.me || {}; $("litePayme").value = me.payme || ""; $("liteFps").value = me.fps || ""; }
  bindFrameField($("liteFrame"), openLite);
  if(openSheet!==$("liteSheet")) showSheet($("liteSheet"));
}
function openLedger(){
  ONLINE.ledgerScope = "month"; renderLedger(); showSheet($("ledgerSheet")); loadGames();
  if(!$("lobby").hidden){ $("scrim").style.zIndex = 46; $("ledgerSheet").style.zIndex = 47; }
}
function renderLedger(){
  const box = $("ledgerBody"); if(!box) return;
  const scope = ONLINE.ledgerScope, st = ledgerStats(scope);
  const opps = [...st.opp.values()].sort((a,b)=>a.money-b.money);
  const sp = [...st.specials].sort((a,b)=>({gold:3,legend:2,rare:1}[b[1].tier]-{gold:3,legend:2,rare:1}[a[1].tier]) || b[1].n-a[1].n);
  const tags = [...st.tags].sort((a,b)=>b[1]-a[1]);
  const fmtD = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; };
  box.innerHTML = `<h3>小氣簿 · ${esc(ONLINE.user.name)}</h3>
    <div class="seg lg-tabs"><button class="opt${scope==="month"?" on":""}" data-sc="month">今個月</button><button class="opt${scope==="all"?" on":""}" data-sc="all">全部</button></div>
    ${ONLINE.games===null ? `<p class="lg-empty">${ONLINE.gamesErr?"暫時讀唔到記錄，請檢查網絡。":"讀緊記錄…"}</p>` : `
    <div class="card"><span class="lbl">${scope==="month"?"今個月":"全部"}輸贏</span>
      <div class="bigmoney num ${cls(st.net)}">${money(st.net)}</div>
      <div class="statrow"><span>打咗 <b>${st.n}</b> 場</span><span>第一名 <b>${st.firsts}</b> 次</span><span>經驗 <b>+${st.games.reduce((a,g)=>a+(g.xp||0),0).toLocaleString("en-US")}</b></span></div></div>
    <div class="card"><h3>邊個贏咗我錢</h3>
      ${opps.length ? opps.map(o=>`<div class="opp"><span>${esc(o.name)}${o.guest?` <span class="uid">（訪客）</span>`:""}<small>同枱 ${o.n} 場</small></span>
        <span class="amt num ${cls(o.money)}">${o.money<0?`輸咗俾佢 ${money(o.money).slice(1)}`:o.money>0?`贏咗佢 ${money(o.money).slice(1)}`:"打和"}</span></div>`).join("") : `<p class="lg-empty">未有記錄。</p>`}
    </div>
    <div class="card"><h3>特別稱號</h3>
      ${sp.length ? `<div class="badges">${sp.map(([n,o])=>badgeHTML(n,o)).join("")}</div>` : `<p class="lg-empty">未攞過特別稱號。</p>`}
      ${tags.length ? `<span class="lbl">其他稱號</span><div class="badges">${tags.map(([n,c])=>`<span class="tag">${esc(n)}<span class="cnt">×${c}</span></span>`).join("")}</div>` : ""}
    </div>
    <div class="card"><h3>牌局記錄</h3>
      ${st.games.length ? st.games.slice(0,60).map(g=>`<div class="gamerow"><span>${fmtD(g.endedAt)} · ${MODE_NAME(g.mode)} · 第 ${g.rank} 名</span>
        <span class="num ${cls(g.money)}" style="font-weight:700">${money(g.money)}</span>
        <small>房間 ${esc(g.room)} · ${g.hands||0} 鋪${g.xp?` · +${g.xp} 經驗`:""}${g.special?` · ${esc(g.special.name)}`:""}${g.gold?" · 根本不是一個Level":""}
          <button class="linkbtn gdel" data-gdel="${esc(g.gameId)}">刪除</button></small></div>`).join("") : `<p class="lg-empty">未有記錄。</p>`}
    </div>`}`;
  box.querySelectorAll("[data-sc]").forEach(b=>b.onclick = () => { ONLINE.ledgerScope = b.dataset.sc; renderLedger(); });
  box.querySelectorAll("[data-gdel]").forEach(b=>b.onclick = () => {
    const g = (ONLINE.games || []).find(x=>x.gameId===b.dataset.gdel); if(!g) return;
    const d = new Date(g.endedAt);
    askConfirm("刪除呢場記錄？", `${d.getMonth()+1}/${d.getDate()} ${MODE_NAME(g.mode)}（${money(g.money)}${g.xp?`，${g.xp} 經驗`:""}）會喺你嘅小氣簿消失，輸贏同經驗值都會扣返。其他玩家嘅記錄唔受影響。刪除咗就冇得還原。`, "刪除", async ()=>{
      const keep = ONLINE.games;
      ONLINE.games = (ONLINE.games || []).filter(x=>x.gameId!==g.gameId);   // 即刻喺畫面消失
      renderLedger(); if(!$("lobby").hidden) renderLobby();
      try{ await ONLINE.backend.deleteGame(ONLINE.user.uid, g.gameId); toast("已刪除記錄。"); loadGames(); }
      catch(e){ ONLINE.games = keep; renderLedger(); if(!$("lobby").hidden) renderLobby(); toast("刪除唔到：" + errText(e)); }
    });
  });
}

/* ---------- 找數：PayMe／轉數快 ---------- */
const paymeURL = v => { v = String(v || "").trim(); if(!v) return ""; if(/^https?:\/\//i.test(v)) return v; if(/^payme\.hsbc\//i.test(v)) return "https://" + v; return "https://payme.hsbc/" + v.replace(/^@/, ""); };
window.__payInfo = p => {
  if(!ONLINE.room) return null;
  const u = (state.uids || [])[p]; if(!u) return null;
  const pr = (u===ONLINE.user.uid ? Object.assign({}, ONLINE.profiles[u] || {}, ONLINE.me || {}) : ONLINE.profiles[u]) || {};
  const payme = paymeURL(pr.payme), fps = String(pr.fps || "").trim();
  return payme || fps ? {payme, fps} : null;
};
window.__mySeat = () => ONLINE.room && ONLINE.user ? (state.uids || []).indexOf(ONLINE.user.uid) : -1;

/* ---------- 全站公告 ---------- */
function renderNotice(){
  const box = $("noticeBox"); if(!box) return;
  const n = (ONLINE.config || {}).notice;
  let gone = null; try{ gone = localStorage.getItem("fansyu-notice-off"); }catch(e){}
  if(!n || !n.on || !n.text || gone===n.id){ box.innerHTML = ""; return; }
  box.innerHTML = `<div class="notice" role="status"><p><small>📢 番鼠公告</small>${esc(n.text)}</p><button type="button" id="noticeX" aria-label="收埋公告">✕</button></div>`;
  $("noticeX").onclick = () => { try{ localStorage.setItem("fansyu-notice-off", n.id); }catch(e){} box.innerHTML = ""; };
}

/* ---------- 加到主畫面（PWA） ---------- */
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints > 1);
let installEvt = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt = e; });
window.addEventListener("appinstalled", ()=>{ installEvt = null; toast("已加到主畫面。"); });
if("serviceWorker" in navigator && /^https:$/.test(location.protocol)) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
async function addToHome(){
  if(installEvt){ installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt = null; return; }
  const ios = isIOS();
  askConfirm("加到主畫面", ios
    ? "用 Safari 打開番鼠 → 撳底部「分享」掣（方格加向上箭咀）→ 揀「加入主畫面」→「新增」。之後喺主畫面撳番鼠 icon 就會全螢幕打開，好似 App 咁用。"
    : "喺 Chrome 撳右上角「⋮」→ 揀「加到主畫面」或者「安裝應用程式」。之後喺主畫面撳番鼠 icon 就會全螢幕打開，好似 App 咁用。", "知道", ()=>{});
}

/* ---------- start ---------- */
async function onlineStart(){
  if(!ONLINE.enabled) return;
  buildOnlineUI();
  checkInviteParam();
  showLobby();
  try{ ONLINE.backend = ONLINE.cfg ? await firebaseBackend(ONLINE.cfg) : mockBackend(); }
  catch(e){
    ONLINE.enabled = false; hideLobby(); renderRoomBar();
    toast("連唔到伺服器，暫時用單機模式。"); return;
  }
  try{ ONLINE.backend.watchConfig(c=>{ ONLINE.config = c || {}; window.__skinCfg = ONLINE.config.skins || {}; renderNotice(); }); }catch(e){}
  watchInvite();
  const wanted = (new URLSearchParams(location.search).get("room") || (()=>{ try{ return sessionStorage.getItem("fansyu-room"); }catch(e){ return null; } })() || "").toUpperCase();
  let tried = false;
  ONLINE.wantRoom = wanted || null; renderLobby();
  ONLINE.backend.onUser(async u=>{
    const prev = ONLINE.user;
    ONLINE.user = u; ONLINE.games = null;
    if(!u){ ONLINE.me = null; stopMeWatch(); stopYueWatch(); applyVipPerks(); if(prev) leaveRoom(true); showLobby(); renderInvite(); return; }
    if(isAdminUser()){ location.replace("admin.html" + (ONLINE.mock ? "?mock=1" : "")); return; }
    if(await ONLINE.backend.isRemoved(u.uid)){ toast("呢個帳戶已經被管理員移除。"); await ONLINE.backend.logout(); return; }
    ONLINE.backend.saveProfile(u.uid, {name:u.name, lastLogin:Date.now()}).catch(()=>{});
    startMeWatch(u.uid);
    loadInbox();
    startYueWatch();
    // 未登入時撳咗「登入再報名」：登入後返返去個邀請
    let pend = null; try{ pend = sessionStorage.getItem("fansyu-yue-pending"); }catch(e){}
    if(pend && pend===ONLINE.yueInId){ ONLINE.yinHidden = false; ONLINE.yinSel = null; try{ sessionStorage.removeItem("fansyu-yue-pending"); }catch(e){} }
    renderInvite();
    renderLobby(); loadGames();
    if(wanted && !tried){
      tried = true;
      try{ if(ONLINE.room!==wanted) await joinRoom(wanted); }catch(e){ toast(e.message && !e.code ? e.message : errText(e)); }
      ONLINE.wantRoom = null;
    }
    renderRoomBar();
  });
  renderLobby();
}
onlineStart();

</script>
