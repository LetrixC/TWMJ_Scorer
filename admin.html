<script src="config.js"></script>
<style>
:root{
  --bg:#F7F3EA; --surface:#FFFDF8; --surface2:#F2ECDF; --fg:#2B2720; --muted:#7A7263; --line:#E6DCC8;
  --gold:#A8842C; --gold-soft:#F6EBCB; --jade:#2F6B4F; --jade-soft:#E4EEE6; --red:#B23A2E; --red-soft:#F8E2DD;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 50% 0%,var(--gold-soft),transparent 55%)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:56px;height:56px;object-fit:contain}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.08em;color:var(--gold)}
.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em;font-family:var(--f-body);font-weight:500}
.brand .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 rgba(120,95,40,.05),0 8px 22px -14px rgba(120,95,40,.35)}
.card h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
input[type=text],input[type=password],input[type=search]{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--fg);width:100%;min-width:0}
.btn{padding:11px 14px;border-radius:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);text-align:center}
.btn.gold{background:linear-gradient(135deg,#B8923A,#9C7726);color:#FFFDF7;border-color:#8A6A22}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.err{margin:0;padding:8px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:900;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{flex:1;min-width:160px}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td.when small{display:block;font-size:11px;color:var(--muted)}
td.when.stale small{color:var(--red)}
th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap;letter-spacing:.04em}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
td.name b{font-weight:700}
td.name small{display:block;color:var(--muted);font-size:11px}
.lv{font-size:12px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 7px;white-space:nowrap}
.vipbox{width:22px;height:22px;accent-color:#A8842C;cursor:pointer}
.stale{color:var(--red)}
.me{font-size:11px;color:var(--jade);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,25,15,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--surface);border-radius:18px;padding:18px 16px 14px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.modal-card h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:20px}
.modal-card p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.modal-list{max-height:180px;overflow:auto;background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
a.back{color:var(--gold);font-weight:700;font-size:13px}
details summary{cursor:pointer;font-weight:700;font-size:14px}
</style>
</head>

<script>
const ADMIN_EMAIL = "ue7aea1e79086e593a1@fansyu.app";
const YEAR = 365*24*3600*1000;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const nickEmail = n => "u" + [...new TextEncoder().encode(n.trim().toLowerCase())].map(x=>x.toString(16).padStart(2,"0")).join("") + "@fansyu.app";
const pinPass = pin => `fansyu-${pin}-mj`;
let toastT = null;
function toast(m){ const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden = true, 3000); }
function fmtCell(t, tag){ if(!t) return "—"; const d = new Date(t); const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}<small>${p(d.getHours())}:${p(d.getMinutes())}${tag||""}</small>`; }
function fmtTime(t){ if(!t) return "—"; const d = new Date(t); const p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function confirmBox(title, text, list, yesText){
  return new Promise(res=>{
    $("mTitle").textContent = title; $("mText").textContent = text; $("mYes").textContent = yesText;
    $("mList").hidden = !list; if(list) $("mList").innerHTML = list.map(esc).join("、");
    $("modal").hidden = false;
    $("mNo").onclick = () => { $("modal").hidden = true; res(false); };
    $("mYes").onclick = () => { $("modal").hidden = true; res(true); };
  });
}
function loadScript(src){ return new Promise((ok,bad)=>{ const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }

/* ---------- backends ---------- */
async function firebaseBackend(cfg){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  await loadScript(base + "firebase-app-compat.js");
  await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), db = firebase.firestore();
  return {
    onUser(cb){ auth.onAuthStateChanged(u=>cb(u ? {uid:u.uid, email:u.email} : null)); },
    login(nick, pin){ return auth.signInWithEmailAndPassword(nickEmail(nick), pinPass(pin)); },
    logout(){ return auth.signOut(); },
    async users(){ const q = await db.collection("users").get(); return q.docs.map(d=>Object.assign({uid:d.id}, d.data())); },
    async removed(){ const q = await db.collection("removed").get(); return q.docs.map(d=>Object.assign({uid:d.id}, d.data())); },
    setVip(uid, v){ return db.collection("users").doc(uid).update({vip:v}); },
    async remove(u){
      const games = await db.collection("users").doc(u.uid).collection("games").get();
      const refs = games.docs.map(d=>d.ref);
      for(let i=0;i<refs.length;i+=400){ const b = db.batch(); refs.slice(i,i+400).forEach(r=>b.delete(r)); await b.commit(); }
      const b = db.batch();
      b.set(db.collection("removed").doc(u.uid), {name:u.name || "", at:Date.now(), lastLogin:u.lastLogin || u.createdAt || null});
      b.delete(db.collection("users").doc(u.uid));
      await b.commit();
    },
    restore(uid){ return db.collection("removed").doc(uid).delete(); },
  };
}
function mockBackend(){
  const L = k => { try{ return JSON.parse(localStorage.getItem("mock:"+k) || "null"); }catch(e){ return null; } };
  const W = (k,v) => localStorage.setItem("mock:"+k, JSON.stringify(v));
  let cb = null;
  const me = () => { try{ return JSON.parse(sessionStorage.getItem("mock:admin") || "null"); }catch(e){ return null; } };
  return {
    onUser(f){ cb = f; setTimeout(()=>f(me()), 0); },
    async login(nick, pin){ const U = L("users") || {}; const r = U[nickEmail(nick)]; if(!r || r.pass!==pinPass(pin)){ const e = new Error("x"); e.code = "auth/invalid-credential"; throw e; }
      const u = {uid:r.uid, email:nickEmail(nick)}; sessionStorage.setItem("mock:admin", JSON.stringify(u)); cb(u); },
    async logout(){ sessionStorage.removeItem("mock:admin"); cb(null); },
    async users(){ const U = L("users") || {}, P = L("profiles") || {}, R = L("removed") || {};
      return Object.values(U).filter(r=>!R[r.uid]).map(r=>Object.assign({uid:r.uid, name:r.name}, P[r.uid] || {})); },
    async removed(){ const R = L("removed") || {}; return Object.entries(R).map(([uid,v])=>Object.assign({uid}, v)); },
    async setVip(uid, v){ const P = L("profiles") || {}; P[uid] = Object.assign(P[uid] || {}, {vip:v}); W("profiles", P); },
    async remove(u){ const R = L("removed") || {}; R[u.uid] = {name:u.name, at:Date.now(), lastLogin:u.lastLogin || null}; W("removed", R);
      const P = L("profiles") || {}; delete P[u.uid]; W("profiles", P); localStorage.removeItem("mock:games:"+u.uid); },
    async restore(uid){ const R = L("removed") || {}; delete R[uid]; W("removed", R); },
  };
}

/* ---------- admin UI ---------- */
let B = null, ME = null, USERS = [], REMOVED = [];
const lastSeen = u => u.lastLogin || u.createdAt || 0;
const isStale = u => u.email!==ADMIN_EMAIL && u.uid!==(ME && ME.uid) && lastSeen(u) < Date.now() - YEAR;
function show(view){ ["loginCard","denyCard","adminView"].forEach(id=>$(id).hidden = id!==view); $("outBtn").hidden = view!=="adminView"; }
async function refresh(){
  try{ [USERS, REMOVED] = await Promise.all([B.users(), B.removed()]); }
  catch(e){ $("rows").innerHTML = `<tr><td colspan="5" class="empty">讀唔到用戶：可能未更新 Firebase 規則。</td></tr>`; return; }
  const rm = new Set(REMOVED.map(r=>r.uid));
  USERS = USERS.filter(u=>!rm.has(u.uid)).sort((a,b)=>lastSeen(b)-lastSeen(a));
  renderTable();
}
function renderTable(){
  const q = $("q").value.trim().toLowerCase();
  const list = USERS.filter(u=>!q || String(u.name||"").toLowerCase().includes(q));
  $("sTotal").textContent = USERS.length;
  $("sVip").textContent = USERS.filter(u=>u.vip).length;
  $("sStale").textContent = USERS.filter(isStale).length;
  $("bulkBtn").disabled = !USERS.some(isStale);
  $("rows").innerHTML = list.length ? list.map(u=>{
    const self = u.uid===ME.uid;
    return `<tr><td class="name"><b>${esc(u.name || "（未有名）")}</b>${self?` <span class="me">你</span>`:""}<small>#${esc(u.uid.slice(0,6))}</small></td>
      <td class="num"><span class="lv">Lv ${u.lv || 1}</span></td>
      <td class="num"><input type="checkbox" class="vipbox" data-vip="${esc(u.uid)}" ${u.vip?"checked":""} aria-label="${esc(u.name)} VIP"></td>
      <td class="when${isStale(u)?" stale":""}">${u.lastLogin ? fmtCell(u.lastLogin) : (u.createdAt ? fmtCell(u.createdAt, " · 註冊") : "—")}</td>
      <td class="num">${self ? "—" : `<button class="btn danger sm" data-rm="${esc(u.uid)}">移除</button>`}</td></tr>`;
  }).join("") : `<tr><td colspan="5" class="empty">${q ? "搵唔到" : "未有用戶"}</td></tr>`;
  document.querySelectorAll("[data-vip]").forEach(c=>c.onchange = async () => {
    const u = USERS.find(x=>x.uid===c.dataset.vip); c.disabled = true;
    try{ await B.setVip(u.uid, c.checked); u.vip = c.checked; toast(`${u.name} ${c.checked ? "已設為 VIP" : "已取消 VIP"}。`); renderTable(); }
    catch(e){ c.checked = !c.checked; toast("改唔到 VIP：可能未更新 Firebase 規則。"); }
    finally{ c.disabled = false; }
  });
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick = async () => {
    const u = USERS.find(x=>x.uid===b.dataset.rm);
    if(!await confirmBox(`移除 ${u.name}？`, "會刪走佢嘅帳戶資料、等級同小氣簿記錄，並封鎖佢登入。刪除咗嘅記錄冇得還原。", null, "確認移除")) return;
    await removeUsers([u]);
  });
  $("rmCount").textContent = REMOVED.length;
  $("rmRows").innerHTML = REMOVED.length ? REMOVED.sort((a,b)=>(b.at||0)-(a.at||0)).map(r=>`<tr><td class="name"><b>${esc(r.name)}</b><small>移除於 ${fmtTime(r.at)}</small></td><td class="num"><button class="btn sm" data-restore="${esc(r.uid)}">解除封鎖</button></td></tr>`).join("") : `<tr><td class="empty">冇</td></tr>`;
  document.querySelectorAll("[data-restore]").forEach(b=>b.onclick = async () => {
    try{ await B.restore(b.dataset.restore); toast("已解除封鎖，佢可以再登入（舊記錄唔會返嚟）。"); refresh(); }catch(e){ toast("解除唔到。"); }
  });
}
async function removeUsers(list){
  let ok = 0;
  for(const u of list){ try{ await B.remove(u); ok++; }catch(e){} }
  toast(ok===list.length ? `已移除 ${ok} 位玩家。` : `移除咗 ${ok} 位，${list.length-ok} 位失敗。`);
  refresh();
}
$("q").addEventListener("input", renderTable);
$("bulkBtn").onclick = async () => {
  const stale = USERS.filter(isStale);
  if(!stale.length) return;
  if(!await confirmBox(`移除 ${stale.length} 位一年內冇上線嘅玩家？`, "以下玩家超過一年冇登入。確認之後會刪走佢哋嘅資料同小氣簿，並封鎖登入，冇得還原。", stale.map(u=>u.name), `確認移除 ${stale.length} 位`)) return;
  await removeUsers(stale);
};
$("loginBtn").onclick = async () => {
  const nick = $("nick").value.trim(), pin = $("pin").value.trim(), e = $("loginErr");
  e.hidden = true;
  if(!nick || !/^\d{4}$/.test(pin)){ e.textContent = "請輸入暱稱同 4 位數 PIN。"; e.hidden = false; return; }
  $("loginBtn").disabled = true;
  try{ await B.login(nick, pin); }
  catch(err){ e.textContent = (err && err.code==="auth/too-many-requests") ? "試錯太多次，請等幾分鐘再試。" : "暱稱或者 PIN 唔啱。"; e.hidden = false; }
  finally{ $("loginBtn").disabled = false; }
};
$("pin").addEventListener("keydown", ev=>{ if(ev.key==="Enter") $("loginBtn").click(); });
$("outBtn").onclick = $("denyOut").onclick = () => B.logout();

(async function start(){
  const cfg = (typeof firebaseConfig !== "undefined" && firebaseConfig) || null;
  const mock = /[?&]mock=1/.test(location.search);
  if(!cfg && !mock){ show("loginCard"); $("loginErr").textContent = "未設定 Firebase（config.js）。"; $("loginErr").hidden = false; $("loginBtn").disabled = true; return; }
  try{ B = cfg ? await firebaseBackend(cfg) : mockBackend(); }
  catch(e){ show("loginCard"); $("loginErr").textContent = "連唔到伺服器。"; $("loginErr").hidden = false; return; }
  B.onUser(u=>{
    ME = u;
    if(!u){ show("loginCard"); return; }
    if(u.email!==ADMIN_EMAIL){ show("denyCard"); return; }
    show("adminView"); refresh();
  });
})();
</script>
</body>
</html>
